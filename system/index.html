<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<title>عيادات د. هدى ياسين</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed emerald sidebar on the right (RTL) + porcelain workspace with a sticky control bar; cards only where a record stands alone. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F7FAF9; --line:#DFE7E4; --line-2:#EBF0EE;
  --ink:#0F201E; --ink-2:#465955; --ink-3:#7A8A86;
  --side:#0E3533; --side-2:#13413E; --side-ink:#DCE9E5; --side-mute:#8FB0A9;
  --accent:#A8834B; --accent-ink:#7A5B28; --accent-soft:#F4EDE0; --gold:#C9A66B;
  --primary:#0F3B39; --on-primary:#F4F8F6; --primary-hover:#155250;
  --good:#17775F; --good-soft:#E3F2EC; --warn:#9A6411; --warn-soft:#FBF0DC; --bad:#B03E38; --bad-soft:#FBE7E5; --info:#2D5F8A; --info-soft:#E4EEF7;
  --c-rev:#0B8C6B; --c-cost:#B8822C;
  --shadow:0 24px 60px -18px rgba(9,34,31,.35);
  --f-display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-sig:"Aref Ruqaa","El Messiri",serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1514; --surface:#111D1C; --surface-2:#152322; --line:#223633; --line-2:#1B2C2A;
  --ink:#E5EEEB; --ink-2:#A9BBB6; --ink-3:#768A85;
  --side:#071110; --side-2:#0F1F1D; --side-ink:#D7E5E1; --side-mute:#7E9B95;
  --accent:#CDAA72; --accent-ink:#DDBE8C; --accent-soft:#2A2419; --gold:#D6B47C;
  --primary:#CDAA72; --on-primary:#1B1408; --primary-hover:#DDBE8C;
  --good:#4CC3A0; --good-soft:#14302A; --warn:#E3A64A; --warn-soft:#33281A; --bad:#EE7C75; --bad-soft:#3A1E1C; --info:#7FB2DE; --info-soft:#17283A;
  --c-rev:#27A884; --c-cost:#B9842E; --shadow:0 24px 60px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1514; --surface:#111D1C; --surface-2:#152322; --line:#223633; --line-2:#1B2C2A;
  --ink:#E5EEEB; --ink-2:#A9BBB6; --ink-3:#768A85;
  --side:#071110; --side-2:#0F1F1D; --side-ink:#D7E5E1; --side-mute:#7E9B95;
  --accent:#CDAA72; --accent-ink:#DDBE8C; --accent-soft:#2A2419; --gold:#D6B47C;
  --primary:#CDAA72; --on-primary:#1B1408; --primary-hover:#DDBE8C;
  --good:#4CC3A0; --good-soft:#14302A; --warn:#E3A64A; --warn-soft:#33281A; --bad:#EE7C75; --bad-soft:#3A1E1C; --info:#7FB2DE; --info-soft:#17283A;
  --c-rev:#27A884; --c-cost:#B9842E; --shadow:0 24px 60px -18px rgba(0,0,0,.7); color-scheme:dark}

[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.35}
a{color:inherit}
.num,td.n,.tbl td.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
small.cur{font-size:.72em;color:var(--ink-3);font-weight:500;margin-inline-start:2px}

#app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* Sidebar */
#side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:26px 14px 18px;scrollbar-width:thin}
.brand{padding:4px 12px 22px;border-bottom:1px solid rgba(201,166,107,.22);margin-bottom:14px}
.sig{font-family:var(--f-sig);font-size:30px;color:var(--gold);line-height:1.25}
.brand-sub{font-size:12.5px;color:var(--side-mute);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:14px;flex:1}
.nav-gl{font-size:11.5px;color:var(--side-mute);padding:0 12px 6px;font-weight:500}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--side-ink);font-size:14.5px;transition:background .15s}
.nav-i .ic{opacity:.75}
.nav-i:hover{background:var(--side-2)}
.nav-i.on{background:rgba(201,166,107,.16);color:var(--gold)}
.nav-i.on .ic{opacity:1}
.nav-i span{flex:1}
.nb{font-size:11.5px;min-width:22px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:var(--side-ink);font-weight:600;font-variant-numeric:tabular-nums}
.nb.warn{background:#C9A66B;color:#1B1408}
.side-foot{font-size:12px;color:var(--side-mute);padding:14px 12px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:16px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--side-mute);flex:none}
.dot.ok{background:#4CC3A0}.dot.warn{background:#E3A64A}

/* Workspace */
#work{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top-title{flex:1;min-width:160px}
.top-title h1{font-size:23px}
.top-title p{margin:0;font-size:12.5px;color:var(--ink-3)}
.top-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sel-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:40px;color:var(--ink-2)}
.sel-wrap select{border:0;background:transparent;height:38px;font-weight:500;color:var(--ink);max-width:180px;cursor:pointer}
.sel-wrap select:focus{outline:none}
.month-nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 4px}
.month-nav b{font-weight:600;min-width:118px;text-align:center;font-size:14px}
.qa{position:relative}
.qa-menu{position:absolute;inset-inline-end:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:20;display:flex;flex-direction:column}
.qa-menu button{display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:start;color:var(--ink)}
.qa-menu button:hover{background:var(--surface-2)}
#main{padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;min-width:0;max-width:1440px;width:100%}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px}
.btn.wa{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.icon-btn.wa{color:var(--good)}
.only-m{display:none}

/* Building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h3{font-size:18px}
.sec-head p{margin:0;color:var(--ink-3);font-size:13px}
.pad{padding:18px 20px}
.muted{color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.3}
.kpi .f{font-size:12.5px;color:var(--ink-3)}
.kpi.hl{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.kpi.hl .l,.kpi.hl .f,.kpi.hl small.cur{color:color-mix(in srgb,var(--on-primary) 72%,transparent)}
.delta{font-weight:600}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.kpi.hl .delta{color:inherit}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.two.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.muted{opacity:.75}
.tag-sample{font-family:var(--f-body);font-size:10.5px;font-weight:600;color:var(--accent-ink);border:1px dashed var(--accent);border-radius:6px;padding:0 5px;margin-inline-start:6px;vertical-align:middle;white-space:nowrap}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}

/* Tables */
.tbl-wrap{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--ink-3);font-size:12.5px;text-align:start;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
.tbl .who{display:flex;flex-direction:column;line-height:1.35}
.tbl .who small{color:var(--ink-3);font-size:12.5px}
.tbl .acts{display:flex;gap:2px;justify-content:flex-end}
.tbl.mini td,.tbl.mini th{padding:8px 10px;font-size:13px}
.inline-sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;padding:0 8px;font-size:13px;cursor:pointer}
.bar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--c-rev);border-radius:4px}
.progress{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);border-radius:3px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-2);transition:background .12s}.li:last-child{border-bottom:0}.li.click:hover,.li.click:active{background:var(--surface-2)}.li>b.num,.li>.num{font-size:15px;white-space:nowrap}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500}
.li .s{font-size:12.5px;color:var(--ink-3)}
.time{font-variant-numeric:tabular-nums;font-weight:600;min-width:72px;color:var(--ink-2);font-size:13.5px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:16px}
.empty{padding:34px 20px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h4{color:var(--ink);font-size:17px}
.empty p{margin:0;max-width:46ch}

/* Filters */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg button b{font-weight:600;font-variant-numeric:tabular-nums;opacity:.8}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;flex:1;min-width:200px;max-width:420px;color:var(--ink-3)}
.search input{border:0;background:transparent;flex:1;height:38px;min-width:0;color:var(--ink)}
.search input:focus{outline:none}
.sp{flex:1}

/* Clinic cards */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ccard{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.ccard h3{font-size:19px}
.ccard .meta{font-size:13px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:12px;color:var(--ink-3)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;font-size:14.5px}
.ccard footer{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:12px}
.people{display:flex;flex-wrap:wrap;gap:6px}

/* Patient */
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.crumbs a{color:var(--accent-ink);text-decoration:none}
.pt-head{padding:20px 22px;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}
.pt-id{display:flex;gap:16px;min-width:0;flex:1}
.avatar{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;font-weight:700;flex:none}
.pt-id h2{font-size:24px}
.pt-id p{margin:2px 0 0}
.alerts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--bad)}
.note{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--ink-2);margin-top:10px !important}
.pt-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.tx{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.tx-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tx-h h4{font-size:17px}
.tx-h p{margin:2px 0 0;font-size:13px}
.tx-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.teeth-tag{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--info);background:var(--info-soft);border-radius:6px;padding:1px 7px;margin-inline-start:6px;font-variant-numeric:tabular-nums;vertical-align:middle}
.tx-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tx-nums div{display:flex;flex-direction:column}
.tx-nums span{font-size:12px;color:var(--ink-3)}
.tx-nums b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.tx-nums small{font-size:11.5px;color:var(--ink-3)}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.inst{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);font-size:12.5px}
.inst .n{grid-row:span 3;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--line-2);font-weight:600;font-size:12px}
.inst b{font-variant-numeric:tabular-nums;font-size:13.5px}
.inst em{font-style:normal;font-weight:600;font-size:11.5px}
.inst.paid em{color:var(--good)}.inst.paid .n{background:var(--good-soft);color:var(--good)}
.inst.late{border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)}.inst.late em{color:var(--bad)}.inst.late .n{background:var(--bad);color:#fff}
.inst.soon em{color:var(--warn)}.inst.open em{color:var(--ink-3)}
details.pays summary{cursor:pointer;color:var(--accent-ink);font-weight:500;font-size:13.5px}
details.pays .tbl-wrap{margin-top:8px;border:1px solid var(--line-2);border-radius:9px}
.tx-f{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:12px}

/* Chart */
.chart{padding:16px 18px 10px;position:relative}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block;margin-top:6px;direction:ltr}
.chart svg text{font-family:var(--f-body);font-size:11px;fill:var(--ink-3)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:10px 12px;font-size:12.5px;min-width:170px;z-index:3}
.tip b{display:block;font-family:var(--f-display);font-size:13.5px;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

/* Modal + forms */
#modal-root{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(6,20,18,.55)}
html.modal-open,html.modal-open body{overflow:hidden;overscroll-behavior:none}
.modal{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:min(90vh,900px);display:flex;flex-direction:column;border:1px solid var(--line);animation:pop .18s ease-out}
.modal.wide{width:min(880px,100%)}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line-2)}
.m-head h3{font-size:19px}.m-head>div{flex:1;min-width:0}.m-head .m-back{flex:none;border:0;background:none}.back-btn{flex:none}
.m-head p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}

const labRedoCost=o=>sum((o.redos||[]).filter(r=>r.bearer!=='lab'),r=>r.cost);

function labCost(month,f){let s=0;for(const o of all('labOrders')){if(!f(o))continue;if(monthOf(o.sentDate)===month)s+=num(o.cost);for(const r of o.redos||[])if(r.bearer!=='lab'&&monthOf(r.date)===month)s+=num(r.cost)}return s}
function doctorDue(d,month,cid){return M(`dd:${d.id}:${month}:${cid||''}`,()=>{
  const inC=x=>!cid||x.clinicId===cid;let collected=0,lab=0,redoDoc=0;
  for(const p of payments())if(p.doctorId===d.id&&monthOf(p.date)===month&&inC(p)&&!(p.t.legacy&&!p.t.legacyShare))collected+=num(p.amount);
  for(const o of all('labOrders')){if(o.doctorId!==d.id||!inC(o))continue;if(monthOf(o.sentDate)===month)lab+=num(o.cost);
    for(const r of o.redos||[])if(monthOf(r.date)===month){if(r.bearer==='doctor')redoDoc+=num(r.cost);else if(r.bearer==='clinic')lab+=num(r.cost)}}
  const hasPct=d.payType==='percent'||d.payType==='mixed',hasSal=d.payType==='salary'||d.payType==='mixed';
  const base=Math.max(0,collected-(d.labDeduct?lab:0));const share=hasPct?base*num(d.percent)/100:0;
  const cl=d.clinicIds||[];let salary=0;if(hasSal&&since(d)<=month){if(!cid)salary=num(d.salary);else if(cl.includes(cid))salary=num(d.salary)/cl.length}
  return {collected,lab,base,share,salary,redoDoc,due:Math.max(0,Math.round(share+salary-redoDoc))};
})}
function pl(month,cid){return M(`pl:${month}:${cid||''}`,()=>{
  const f=x=>!cid||x.clinicId===cid;
  const revenue=sum(payments().filter(p=>monthOf(p.date)===month&&f(p)),p=>p.amount);
  const exps=all('expenses').filter(e=>monthOf(e.date)===month&&f(e));
  const opex=sum(exps,e=>e.amount);
  const rent=sum(all('clinics').filter(c=>(!cid||c.id===cid)&&since(c)<=month),rentMonthly);
  const staff=sum(all('staff').filter(x=>x.active!==false&&f(x)&&since(x)<=month),x=>x.salary);
  const doctors=sum(all('doctors').filter(d=>d.active!==false),d=>doctorDue(d,month,cid).due);
  const lab=labCost(month,f);
  const supplies=sum(all('supplierTx').filter(x=>x.kind==='invoice'&&!x.opening&&monthOf(x.date)===month&&f(x)),x=>x.amount);
  const cost=opex+rent+staff+doctors+lab+supplies;
  return {revenue,opex,rent,staff,doctors,lab,supplies,cost,net:revenue-cost,exps};
})}

  premolar:'M9 28C8 18 11 5 15 2.5C18 1.5 19 8 20 14C21 8 22 1.5 25 2.5C29 5 32 18 31 28C34 35 34 45 32 51C30 56 25 58 20 56C15 58 10 56 8 51C6 45 6 35 9 28Z',
  canine:'M12 29C11 17 14 2 20 1C26 2 29 17 28 29C31 36 31 45 28 51C26 55 23 59 20 59C17 59 14 55 12 51C9 45 9 36 12 29Z',
  incisor:'M12.5 29C11.5 17 15 3 20 2C25 3 28.5 17 27.5 29C30.5 36 31.5 46 30.5 53C29.5 57 26 58 20 58C14 58 10.5 57 9.5 53C8.5 46 9.5 36 12.5 29Z'};
const toothType=n=>{const d=n%10,prim=Math.floor(n/10)>=5;if(d<=2)return 'incisor';if(d===3)return 'canine';if(prim)return 'molar';return d<=5?'premolar':'molar'};
const TOOTH_W={molar:1.32,premolar:1.02,canine:.98,incisor:.92};
function toothBtn(n,sel,lower){const on=sel.includes(String(n));const t=toothType(n);
  return `<button type="button" class="tooth t-${t} ${on?'on':''}" style="--w:${TOOTH_W[t]}" data-tooth="${n}" aria-pressed="${on}" aria-label="سن ${n}" data-act="tooth"><svg viewBox="0 0 40 60" aria-hidden="true"><g${lower?' transform="matrix(1 0 0 -1 0 60)"':''}><path class="tb" d="${TOOTH_PATH[t]}"/><path class="cej" d="M${t==='molar'?6:t==='premolar'?9.5:12} 30Q20 ${lower?26:34} ${t==='molar'?34:t==='premolar'?30.5:28} 30"/></g><text x="20" y="${lower?21:47}">${n}</text></svg></button>`}
function teethPicker(id,k,sel){

const teethSync=box=>{const n=box.querySelectorAll('.tooth[aria-pressed="true"]').length;const c=box.querySelector('.sel-count');if(c)c.textContent=n?n+' سن محدد':'اضغط على السن لتحديده';box.closest('form')?.dispatchEvent(new Event('change'))};

ACTIONS.teethAll=(d,el)=>{const box=el.closest('.teeth');const set=box.querySelector(box.classList.contains('show-prim')?'.arch-set.prim':'.arch-set.perm');
  set.querySelectorAll('.tooth').forEach(b=>{const lower=!!b.closest('.arch.low');const on=d.v==='none'?false:d.v==='up'?(!lower||b.getAttribute('aria-pressed')==='true'):(lower||b.getAttribute('aria-pressed')==='true');b.setAttribute('aria-pressed',on);b.classList.toggle('on',on)});
  if(d.v==='none')box.querySelectorAll('.tooth').forEach(b=>{b.setAttribute('aria-pressed',false);b.classList.remove('on')});teethSync(box)};
function readForm(form,fields){
  const v={};
  for(const f of fields){const el=form.querySelector('#f_'+f.k);
    if(f.type==='section'||f.type==='html')continue;
    if(f.type==='checkbox')v[f.k]=!!(el&&el.checked);
    else if(f.type==='checks')v[f.k]=[...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.type==='catpick')v[f.k]=(form.querySelector(`input[name="${f.k}"]:checked`)||{}).value||'';
    else if(f.type==='teeth')v[f.k]=[...form.querySelectorAll(`[data-teeth="${f.k}"] .tooth[aria-pressed="true"]`)].map(b=>b.dataset.tooth);
    else if(f.type==='money'||f.type==='number')v[f.k]=el&&el.value.trim()!==''?num(el.value):'';
    else if(f.type==='patient'){const txt=(el?el.value:'').trim();const p=all('patients').find(p=>patientLabel(p)===txt)||all('patients').find(p=>p.name===txt);v[f.k]=p?p.id:'';v[f.k+'_new']=p?'':txt}
    else if(f.type==='tel')v[f.k]=el?normDigits(el.value).trim():'';
    else v[f.k]=el?el.value.trim():'';
  }
  return v;
}
function formModal({title,sub,fields,values={},submit='حفظ',onSubmit,onChange,extra='',wide,danger}){
  const fid='frm'+uid();
  openModal(`<form id="${fid}" novalidate><div class="m-head"><div><h3>${esc(title)}</h3>${sub?`<p>${sub}</p>`:''}</div><button type="button" class="icon-btn" data-act="closeModal" aria-label="إغلاق">${ic('x')}</button></div>
  <div class="m-body"><div class="grid-form">${fields.map(f=>fieldHTML(f,values[f.k])).join('')}${extra}</div></div>
  <div class="m-foot">${danger?`<button type="button" class="btn ghost danger" id="${fid}-del">${ic('trash',16)} ${esc(danger.label||'حذف')}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-act="closeModal">إلغاء</button><button type="submit" class="btn primary">${esc(submit)}</button></div></form>`,wide);
  const form=document.getElementById(fid);
  const apply=()=>{const v=readForm(form,fields);for(const f of fields)if(f.show){const el=form.querySelector(`.fld[data-k="${f.k}"]`);if(el)el.hidden=!f.show(v)}if(onChange)onChange(v,form)};
  form.addEventListener('input',apply);form.addEventListener('change',apply);apply();
  if(danger)document.getElementById(fid+'-del').onclick=danger.onClick;
  form.addEventListener('submit',async e=>{
    e.preventDefault();form.querySelectorAll('.fld.err').forEach(x=>{x.classList.remove('err');x.querySelector('.emsg')?.remove()});
    const v=readForm(form,fields);
    for(const f of fields){if(f.req&&(!f.show||f.show(v))&&(v[f.k]===''||v[f.k]==null||(Array.isArray(v[f.k])&&!v[f.k].length))){const el=form.querySelector(`.fld[data-k="${f.k}"]`);if(el){el.classList.add('err');el.insertAdjacentHTML('beforeend','<small class="emsg">هذا الحقل مطلوب</small>');el.querySelector('input,select,textarea')?.focus()}return}}
    const btn=form.querySelector('[type=submit]');btn.disabled=true;
    try{const r=await onSubmit(v,form);if(r!==false)closeModal();else btn.disabled=false}
    catch(err){btn.disabled=false;if(err&&!err.code)toast(err.message||'حدث خطأ','bad')}
  });
  return form;
}

const delta=(cur,prev,invert)=>{if(!prev)return '';const d=Math.round((cur-prev)/Math.abs(prev)*100);if(!isFinite(d)||d===0)return '<span class="delta">بدون تغيير عن الشهر السابق</span>';const good=invert?d<0:d>0;return `<span class="delta ${good?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}%</span> عن الشهر السابق`};
const secHead=(t,p,actions='')=>`<div class="sec-head"><div><h3>${t}</h3>${p?`<p>${p}</p>`:''}</div><div class="toolbar">${actions}</div></div>`;

/* ---------- Chart: 6-month revenue vs cost (months run right-to-left) ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barPath(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function trendChart(cid){
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(state.month,-i));
  const data=months.map(mk=>{const p=pl(mk,cid);return {mk,rev:p.revenue,cost:p.cost,net:p.net}});
  const top=niceMax(Math.max(...data.flatMap(d=>[d.rev,d.cost]),1));
  const W=620,H=230,L=14,R=70,T=12,B=30,pw=W-L-R,ph=H-T-B,gw=pw/6,bw=Math.min(22,gw*.27);
  const y=v=>T+ph-(v/top)*ph;
  let g='';for(let i=0;i<=4;i++){const v=top*i/4;const yy=y(v);g+=`<line class="grid" x1="${L}" x2="${L+pw}" y1="${yy}" y2="${yy}"/><text x="${W-R+8}" y="${yy+4}" text-anchor="start">${shortNum(v)}</text>`}
  let bars='';
  data.forEach((d,i)=>{const gx=L+pw-(i+1)*gw;const cx=gx+gw/2;
    bars+=`<path d="${barPath(cx+1,y(d.rev),bw,T+ph-y(d.rev),4)}" fill="var(--c-rev)"/><path d="${barPath(cx-1-bw,y(d.cost),bw,T+ph-y(d.cost),4)}" fill="var(--c-cost)"/>`;
    const [yy,mm]=d.mk.split('-').map(Number);
    bars+=`<text x="${cx}" y="${H-8}" text-anchor="middle" ${d.mk===state.month?'style="fill:var(--ink);font-weight:600"':''}>${MONTHS_AR[mm-1]}</text>`;
    bars+=`<rect class="hit" x="${gx}" y="${T}" width="${gw}" height="${ph}" rx="6" data-tip="${esc(JSON.stringify({m:monthLabel(d.mk),r:d.rev,c:d.cost,n:d.net}))}"/>`;
  });
  return `<div class="card chart" id="trend"><div class="sec-head"><div><h3 style="font-size:16px">الإيرادات مقابل الكلف</h3><p>آخر ستة أشهر${cid?' · '+esc(clinicName(cid)):''}</p></div><div class="legend"><span><i style="background:var(--c-rev)"></i>إيرادات محصّلة</span><span><i style="background:var(--c-cost)"></i>إجمالي الكلف</span></div></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مخطط الإيرادات والكلف لآخر ستة أشهر"><line class="grid" x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" style="stroke:var(--line)"/>${g}${bars}</svg></div>`;
}
document.addEventListener('mouseover',e=>{const h=e.target.closest&&e.target.closest('.hit');const box=$('#trend');if(!box)return;let tip=box.querySelector('.tip');
  if(!h){if(tip)tip.remove();return}const d=JSON.parse(h.dataset.tip);if(!tip){tip=document.createElement('div');tip.className='tip';box.appendChild(tip)}
  tip.innerHTML=`<b>${esc(d.m)}</b><div><span>إيرادات</span><span>${fmt(d.r)}</span></div><div><span>كلف</span><span>${fmt(d.c)}</span></div><div><span>صافي</span><span class="${d.n<0?'bad-t':'good-t'}">${fmt(d.n)}</span></div>`;
  const br=box.getBoundingClientRect(),hr=h.getBoundingClientRect();let left=hr.left-br.left+hr.width/2-90;left=Math.max(8,Math.min(left,br.width-190));tip.style.left=left+'px';tip.style.top=(hr.top-br.top+10)+'px'});

function labLedger(lab){
  const rows=[];
  all('labOrders').filter(o=>o.labId===lab.id).forEach(o=>{rows.push({date:o.sentDate,d:`${o.work} · ${patientName(o.patientId)}`,debit:num(o.cost),credit:0});(o.redos||[]).forEach(r=>{if(r.bearer!=='lab'&&num(r.cost))rows.push({date:r.date,d:`إعادة: ${o.work} · ${r.reason||''}`,debit:num(r.cost),credit:0})})});
  if(num(lab.opening))rows.push({date:lab.openingDate||'',d:'رصيد سابق قبل النظام',debit:num(lab.opening),credit:0});
  all('labPayments').filter(p=>p.labId===lab.id).forEach(p=>rows.push({date:p.date,d:'دفعة للمختبر'+(p.note?' · '+p.note:''),debit:0,credit:num(p.amount),pid:p.id}));
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));let bal=0;rows.forEach(r=>{bal+=r.debit-r.credit;r.bal=bal});return rows;
}

  const ss=all('staff').filter(cf).sort((a,b)=>(a.active===false)-(b.active===false)||clinicName(a.clinicId).localeCompare(clinicName(b.clinicId),'ar'));
  return `${secHead('السكرتارية والموظفون',`إجمالي الرواتب الشهرية: ${fmt(sum(ss.filter(s=>s.active!==false),s=>s.salary))} د.ع`,`<a class="btn" href="#users" data-act="go" data-page="users">${ic('gear',16)} المستخدمون والصلاحيات</a><button class="btn primary" data-act="newStaff">${ic('plus',16)} موظف جديد</button>`)}
  <section class="card">${ss.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>الوظيفة</th><th>العيادة</th><th>الهاتف</th><th>الأطباء المرتبطون</th><th class="n">الراتب الشهري</th><th>الدخول للنظام</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr ${s.active===false?'style="opacity:.55"':''}><td><b>${esc(s.name)}</b>${sampleTag(s)}${s.active===false?' '+chip('منتهية الخدمة'):''}${accessLbl(s)?' '+chip(accessLbl(s),s.access==='owner'?'bad':'accent'):''}</td><td>${esc(s.role||'سكرتيرة')}</td><td>${esc(clinicName(s.clinicId))}</td><td dir="ltr" style="text-align:end">${esc(s.phone||'')}</td><td><div class="people">${(s.doctorIds||[]).map(id=>chip(docName(id),'info')).join('')||'<span class="muted">—</span>'}</div></td><td class="n"><b>${fmt(s.salary)}</b></td><td>${accountCell('staff',s)}</td><td><div class="acts"><button class="icon-btn" data-act="editStaff" data-id="${s.id}" aria-label="تعديل">${ic('edit',16)}</button><button class="icon-btn" data-act="delStaff" data-id="${s.id}" aria-label="حذف" title="حذف">${ic('trash',16)}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('لا موظفين بعد','',`<button class="btn primary sm" data-act="newStaff">${ic('plus',16)} موظف جديد</button>`)}</section>`;
};

PAGES.expenses=()=>{
  const m=state.month;const ex=all('expenses').filter(e=>monthOf(e.date)===m&&cf(e)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const byC={};ex.forEach(e=>byC[e.cat]=(byC[e.cat]||0)+num(e.amount));
  const rows=state.expCat==='all'?ex:ex.filter(e=>e.cat===state.expCat);
  const prevRec=all('expenses').filter(e=>monthOf(e.date)===shiftMonth(m,-1)&&e.recurring&&cf(e)&&!all('expenses').some(x=>x.fromId===e.id&&monthOf(x.date)===m));
  return `${secHead(`مصاريف ${monthLabel(m)}: ${fmt(sum(ex,e=>e.amount))} د.ع`,'الكهرباء، المولدة، الماء، الإنترنت، الصيانة وغيرها. الإيجار والرواتب تُحتسب تلقائياً.',`${prevRec.length?`<button class="btn" data-act="copyRecurring">${ic('redo',16)} نسخ ${prevRec.length} مصروف متكرر من الشهر السابق</button>`:''}${pendingFixed(m).length?`<button class="btn" data-act="recordFixed">${ic('building',16)} تسجيل المصاريف الثابتة للعيادات (${sum(pendingFixed(m),([,it])=>it.length)} بند)</button>`:''}<button class="btn primary" data-act="newExpense">${ic('plus',16)} مصروف</button>`)}
  <div class="seg">${[['all','الكل',ex.length]].concat(EXP_CATS.filter(([k])=>byC[k]).map(([k,l])=>[k,l,fmt(byC[k])])).map(([k,l,n])=>`<button class="${state.expCat===k?'on':''}" data-act="expCat" data-v="${k}">${l} <b>${n}</b></button>`).join('')}</div>
  <section class="card">${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>التاريخ</th><th>العيادة</th><th>البند</th><th>التفاصيل</th><th class="n">المبلغ</th><th>سجّلها</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(clinicName(e.clinicId))}</td><td>${chip((EXP_CATS.find(c=>c[0]===e.cat)||[,'أخرى'])[1],'accent')}${e.recurring?' '+chip('متكرر'):''}${!e.fixed?' '+chip((PAID_FROM.find(x=>x[0]===srcOf(e,'expenses'))||[,''])[1],srcOf(e,'expenses')==='main'?'info':''):''}</td><td>${esc(e.note||'')}${sampleTag(e)}</td><td class="n"><b>${fmt(e.amount)}</b></td><td>${who(e.createdBy)}</td><td><div class="acts"><button class="icon-btn" data-act="editExpense" data-id="${e.id}" aria-label="تعديل">${ic('edit',16)}</button></div></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">المجموع</td><td class="n">${fmt(sum(rows,e=>e.amount))}</td><td colspan="2"></td></tr></tfoot></table></div>`:empty('لا مصاريف مسجلة لهذا الشهر','',`<button class="btn primary sm" data-act="newExpense">${ic('plus',16)} مصروف</button>`)}</section>`;
};

PAGES.payroll=()=>{
  const m=state.month;const cid=state.clinic==='all'?null:state.clinic;
  const ss=all('staff').filter(s=>s.active!==false&&!s.accountOnly&&cf(s)&&since(s)<=m).sort((a,b)=>clinicName(a.clinicId).localeCompare(clinicName(b.clinicId),'ar'));
  const ds=all('doctors').filter(d=>d.active!==false&&(!cid||(d.clinicIds||[]).includes(cid))).sort(byName);
  const cs=all('clinics').filter(c=>c.active!==false&&num(c.rent)&&(!cid||c.id===cid)).sort((a,b)=>(a.rentNext||'').localeCompare(b.rentNext||''));
  const pays=all('payouts').filter(p=>p.month===m&&(p.kind!=='rent'||!cid||p.clinicId===cid)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const sDue=sum(ss,s=>s.salary),sPaid=sum(ss,s=>paidFor('staff',s.id,m));
  const dDue=sum(ds,d=>doctorDue(d,m,null).due),dPaid=sum(ds,d=>paidFor('doctor',d.id,m));
  const stat=(due,paid)=>paid>=due&&due>0?chip('مكتمل','good'):paid>0?chip('جزئي','warn'):chip('غير مصروف');
  return `<div class="kpis">${kpi('رواتب الموظفين',money(sDue),`مصروف ${fmt(sPaid)} · متبقٍ ${fmt(Math.max(0,sDue-sPaid))}`)}${kpi('مستحقات الأطباء',money(dDue),`مصروف ${fmt(dPaid)} · متبقٍ ${fmt(Math.max(0,dDue-dPaid))}`)}${kpi('الإيجارات (شهرياً)',money(sum(cs,rentMonthly)),cs.filter(c=>{const r=rentState(c);return r&&r[0]!=='good'}).length+' إيجار يستحق قريباً')}${kpi('إجمالي المتبقي للصرف',money(Math.max(0,sDue-sPaid)+Math.max(0,dDue-dPaid)),monthLabel(m),'hl')}</div>
  <section class="card"><div class="card-h"><h3>رواتب السكرتارية والموظفين</h3></div>${ss.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>العيادة</th><th class="n">الراتب</th><th class="n">المصروف</th><th class="n">المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody>${ss.map(s=>{const p=paidFor('staff',s.id,m);return `<tr><td><b>${esc(s.name)}</b><div class="muted" style="font-size:12px">${esc(s.role||'')}</div></td><td>${esc(clinicName(s.clinicId))}</td><td class="n">${fmt(s.salary)}</td><td class="n">${fmt(p)}</td><td class="n"><b>${fmt(Math.max(0,num(s.salary)-p))}</b></td><td>${stat(num(s.salary),p)}</td><td>${p<num(s.salary)?`<button class="btn sm" data-act="payout" data-kind="staff" data-id="${s.id}">صرف</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:empty('لا موظفين','')}</section>
  <section class="card"><div class="card-h"><h3>مستحقات الأطباء</h3><span class="muted" style="font-size:12.5px">النسبة × (المحصّل − المختبر إن وُجد) + الراتب − الإعادات على الطبيب</span></div>${ds.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الطبيب</th><th class="n">المحصّل</th><th class="n">النسبة</th><th class="n">الراتب</th><th class="n">خصومات</th><th class="n">المستحق</th><th class="n">المصروف</th><th>الحالة</th><th></th></tr></thead><tbody>${ds.map(d=>{const x=doctorDue(d,m,null);const p=paidFor('doctor',d.id,m);return `<tr><td><b>د. ${esc(d.name)}</b><div class="muted" style="font-size:12px">${esc((PAY_TYPES.find(t=>t[0]===d.payType)||PAY_TYPES[0])[1])}${d.payType!=='salary'?' '+num(d.percent)+'%':''}</div></td><td class="n">${fmt(x.collected)}</td><td class="n">${fmt(x.share)}</td><td class="n">${fmt(x.salary)}</td><td class="n ${x.redoDoc?'bad-t':''}">${x.redoDoc?fmt(x.redoDoc):'—'}</td><td class="n"><b>${fmt(x.due)}</b></td><td class="n">${fmt(p)}</td><td>${stat(x.due,p)}</td><td>${p<x.due?`<button class="btn sm" data-act="payout" data-kind="doctor" data-id="${d.id}">صرف</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:empty('لا أطباء','')}</section>
  <section class="card"><div class="card-h"><h3>إيجارات العيادات</h3></div>${cs.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>العيادة</th><th>المؤجر</th><th>الدورة</th><th class="n">المبلغ</th><th>الاستحقاق القادم</th><th></th></tr></thead><tbody>${cs.map(c=>{const r=rentState(c);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.landlord||'—')}${c.landlordPhone?`<div class="muted" dir="ltr" style="font-size:12px;text-align:end">${esc(c.landlordPhone)}</div>`:''}</td><td>${(PERIODS.find(x=>x[0]===String(c.rentPeriod||1))||PERIODS[0])[1]}</td><td class="n"><b>${fmt(c.rent)}</b></td><td>${fmtDate(c.rentNext)} ${r?chip(r[1],r[0]):''}</td><td><button class="btn sm" data-act="payRent" data-id="${c.id}">تسجيل الدفع</button></td></tr>`}).join('')}</tbody></table></div>`:empty('لا إيجارات مسجلة','أضف مبلغ الإيجار وتاريخ استحقاقه في بطاقة كل عيادة')}</section>
  <section class="card"><div class="card-h"><h3>سجل الصرف · ${monthLabel(m)}</h3></div>${pays.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>التاريخ</th><th>النوع</th><th>المستفيد</th><th>ملاحظة</th><th class="n">المبلغ</th><th>سجّلها</th><th></th></tr></thead><tbody>${pays.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${chip(p.kind==='staff'?'راتب':p.kind==='doctor'?'مستحقات طبيب':'إيجار',p.kind==='rent'?'info':'accent')}</td><td>${esc(p.kind==='staff'?(get('staff',p.personId)?.name||'—'):p.kind==='doctor'?docName(p.personId):clinicName(p.clinicId))}</td><td>${esc(p.note||'')}</td><td class="n"><b>${fmt(p.amount)}</b></td><td>${who(p.createdBy)}</td><td><button class="icon-btn" data-act="delDoc" data-col="payouts" data-id="${p.id}" aria-label="حذف">${ic('trash',15)}</button></td></tr>`).join('')}</tbody></table></div>`:empty('لم يُصرف شيء بعد لهذا الشهر','')}</section>`;
};

PAGES.reports=()=>{
  const m=state.month;const rcid=state.clinic==='all'?null:state.clinic;const cs=all('clinics').filter(c=>c.active!==false&&(!rcid||c.id===rcid)).sort(byName);const T=pl(m,rcid);
  const rows=cs.map(c=>[c.name,pl(m,c.id)]);
  const keys=['revenue','staff','doctors','rent','lab','supplies','opex','net'];
  const un={};keys.forEach(k=>un[k]=T[k]-sum(rows,([,p])=>p[k]));const hasUn=keys.some(k=>Math.abs(un[k])>1);
  const trs=(name,p,b)=>`<tr${b?' style="font-weight:600"':''}><td>${esc(name)}</td>${keys.map(k=>`<td class="n ${k==='net'?(p.net<0?'bad-t':'good-t'):''}">${k==='net'?`<b>${fmt(p[k])}</b>`:fmt(p[k])}</td>`).join('')}<td class="n">${p.revenue?pctOf(p.net,p.revenue)+'%':'—'}</td></tr>`;
  const byCat={};T.exps.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+num(e.amount));
  const hist=[];for(let i=5;i>=0;i--){const mk=shiftMonth(m,-i);hist.push([mk,pl(mk,state.clinic==='all'?null:state.clinic)])}
  const docs=all('doctors').filter(d=>d.active!==false&&(!rcid||(d.clinicIds||[]).includes(rcid))).map(d=>[d,doctorDue(d,m,rcid)]).filter(([d,x])=>!rcid||x.collected||x.due||(d.clinicIds||[]).includes(rcid)).sort((a,b)=>b[1].collected-a[1].collected);
  const cost=[['رواتب الموظفين',T.staff],['مستحقات الأطباء',T.doctors],['الإيجارات',T.rent],['المختبرات',T.lab],['المواد والمشتريات',T.supplies],['المصاريف التشغيلية',T.opex]];
  return `${secHead(`التقرير المالي${rcid?' · '+esc(clinicName(rcid)):''} · ${monthLabel(m)}`,'الإيرادات = ما حُصّل فعلاً من المرضى. الكلف تشمل الرواتب والإيجار الشهري المقسّط والمختبر والمواد.',`<button class="btn" data-act="exportCsv">${ic('down',16)} تصدير Excel (CSV)</button>`)}
  <div class="kpis">${kpi('الإيرادات',money(T.revenue))}${kpi('الكلف',money(T.cost))}${kpi('صافي الربح',money(T.net),T.revenue?'الهامش '+pctOf(T.net,T.revenue)+'%':'','hl')}${kpi('أعلى بند كلفة',(cost.slice().sort((a,b)=>b[1]-a[1])[0]||['—'])[0],fmt((cost.slice().sort((a,b)=>b[1]-a[1])[0]||[,0])[1])+' د.ع')}</div>
  ${catReportCard(m,rcid)}
  <section class="card"><div class="card-h"><h3>${rcid?'الأرباح والخسائر':'الأرباح والخسائر حسب العيادة'}</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>العيادة</th><th class="n">الإيرادات</th><th class="n">رواتب</th><th class="n">أطباء</th><th class="n">إيجار</th><th class="n">مختبر</th><th class="n">مواد</th><th class="n">تشغيلية</th><th class="n">الصافي</th><th class="n">الهامش</th></tr></thead><tbody>${rows.map(([n,p])=>trs(n,p)).join('')}${hasUn?trs('عام / غير مخصص لعيادة',Object.assign({},un),false):''}</tbody><tfoot>${trs('المجموع',T,true).replace(/^<tr[^>]*>/,'<tr>')}</tfoot></table></div></section>
  <div class="two even">
   <section class="card"><div class="card-h"><h3>توزيع الكلف</h3></div><div class="pad">${cost.map(([l,v])=>`<div class="stat-line"><span>${l}</span><b>${fmt(v)} <small class="cur">${T.cost?pctOf(v,T.cost)+'%':''}</small></b></div>`).join('')}${Object.keys(byCat).length?`<div class="cat-row" style="margin-top:12px">${EXP_CATS.filter(([k])=>byCat[k]).map(([k,l])=>chip(`${l}: ${fmt(byCat[k])}`,'accent')).join('')}</div>`:''}</div></section>
   <section class="card"><div class="card-h"><h3>إنتاجية الأطباء</h3></div>${docs.length?`<div class="tbl-wrap"><table class="tbl mini"><thead><tr><th>الطبيب</th><th class="n">المحصّل</th><th class="n">المستحق له</th><th class="n">صافي للعيادة</th></tr></thead><tbody>${docs.map(([d,x])=>`<tr><td>د. ${esc(d.name)}</td><td class="n">${fmt(x.collected)}</td><td class="n">${fmt(x.due)}</td><td class="n"><b>${fmt(x.collected-x.due)}</b></td></tr>`).join('')}</tbody></table></div>`:empty('لا أطباء','')}</section>
  </div>
  <section class="card"><div class="card-h"><h3>آخر ستة أشهر${state.clinic!=='all'?' · '+esc(clinicName(state.clinic)):''}</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>الشهر</th><th class="n">الإيرادات</th><th class="n">الكلف</th><th class="n">الصافي</th><th class="n">الهامش</th></tr></thead><tbody>${hist.reverse().map(([mk,p])=>`<tr><td>${monthLabel(mk)}</td><td class="n">${fmt(p.revenue)}</td><td class="n">${fmt(p.cost)}</td><td class="n ${p.net<0?'bad-t':'good-t'}"><b>${fmt(p.net)}</b></td><td class="n">${p.revenue?pctOf(p.net,p.revenue)+'%':'—'}</td></tr>`).join('')}</tbody></table></div></section>`;
};

const testBar=()=>{if(!testMode()||!isAdmin())return '';
  if(role().test)return `<div class="test-bar">${ic('alert',16)}<span><b>نسخة تجريبية:</b> ترى لوحة الإدارة كاملة لأن الإدارة فعّلت وضع التجربة. ${Store.me?'':'سجّل الدخول إلى Claude لتتمكن من الحفظ.'}</span></div>`;
  return canOwn()?`<div class="test-bar">${ic('alert',16)}<span><b>وضع التجربة مفعّل:</b> كل من يفتح الرابط يرى لوحة الإدارة وكل البيانات المالية.</span><span class="sp"></span><button class="btn sm" data-act="testOff">إيقاف وضع التجربة</button></div>`:'';};

   <p style="margin:0">عند تفعيله، أي شخص يفتح الرابط ولم يُربط حسابه بطبيب أو سكرتيرة يرى <b>لوحة الإدارة كاملة</b> بدل شاشة «ربط الحساب». الأطباء والسكرتارية المربوطون يبقون على صفحاتهم.</p>
   <p class="muted" style="margin:0">للحفظ والتعديل يحتاج الزائر صلاحية تعديل من زر <b>Share</b> في claude.ai. من يملك صلاحية مشاهدة فقط يرى كل شيء لكن لا يستطيع الحفظ.</p>
   <p class="bad-t" style="margin:0">تنبيه: في هذا الوضع تظهر أسماء المرضى والديون والأرباح لكل من يفتح الرابط. أوقفه قبل إدخال البيانات الحقيقية.</p>
   <div><button class="btn ${on?'danger':'primary'}" data-act="${on?'testOff':'testOn'}">${on?'إيقاف وضع التجربة':'تفعيل وضع التجربة'}</button></div></section>`};
PAGES.prefs=()=>{
  const samples=COLS.reduce((s,c)=>s+all(c).filter(x=>x.sample).length,0);const total=COLS.reduce((s,c)=>s+S[c].size,0);
  return testCard()+`<section class="card pad" style="display:flex;flex-direction:column;gap:10px"><h3>حفظ البيانات</h3>
   ${Store.mode==='cloud'?`${window.STANDALONE?`<p style="margin:0">البيانات محفوظة في قاعدة بيانات Firebase الخاصة بالعيادات، ويدخل لها فقط المالك والبريد الإلكتروني المسموح له من «دعوة للدخول». أنت داخل بـ <span dir="ltr">${esc(window.huda?window.huda.email():'')}</span>.</p>`:''}<p style="margin:0${window.STANDALONE?';display:none':''}">البيانات محفوظة في قاعدة بيانات هذه الصفحة على claude.ai، ويراها ويعدّلها كل من تشاركهم الصفحة بصلاحية «مساهم» أو أعلى (مثل السكرتارية). الأشخاص بصلاحية «مشاهد» يرون فقط ولا يعدّلون.</p>`:`<div class="mode-banner">الصفحة تعمل الآن بوضع محلي: البيانات على هذا المتصفح فقط. افتحها من claude.ai بعد تسجيل الدخول لتُحفظ مركزياً.</div>`}
   <p class="muted" style="margin:0">عدد السجلات: ${fmt(total)} من أصل 25,000 سجل متاح.</p></section>

async function claimCode(raw){

const DEBT_ST={ok:['منتظم','good'],late:['متأخر','warn'],stuck:['متعثر','bad']};
const BUCKETS=['0 – 30 يوم','31 – 60 يوم','61 – 90 يوم','أكثر من 90 يوم'];
const debtors=()=>M('debtors',()=>{const st=new Map();
  for(const t of all('treatments')){if(!cf(t))continue;const bal=tBal(t);if(bal<=0)continue;let s=st.get(t.patientId);
    if(!s){s={pid:t.patientId,total:0,paid:0,bal:0,tx:[],docs:new Set(),clinics:new Set(),lastPay:'',oldest:'',late:0};st.set(t.patientId,s)}
    s.total+=tTotal(t);s.paid+=tPaid(t);s.bal+=bal;s.tx.push(t);s.docs.add(t.doctorId);s.clinics.add(t.clinicId);
    for(const p of t.payments||[])if((p.date||'')>s.lastPay)s.lastPay=p.date;
    if(!s.oldest||(t.date||'')<s.oldest)s.oldest=t.date||TODAY;
    s.late+=sum(schedStatus(t).filter(x=>x.state==='late'),x=>num(x.amount)-x.paid)}
  const out=[];for(const s of st.values()){s.p=get('patients',s.pid)||{name:'—'};s.age=Math.max(0,daysBetween(s.lastPay||s.oldest||TODAY,TODAY));s.bucket=s.age<=30?0:s.age<=60?1:s.age<=90?2:3;

  resolveNames();$('#copy-stmt').onclick=()=>navigator.clipboard.writeText(text).then(()=>toast('تم نسخ الكشف')).catch(()=>toast('تعذّر النسخ','warn'));

/* ---------- Cash handover to Dr. Huda: leaves the clinic's custody at once, joins the safe when she confirms ---------- */
const HO_ST={pending:['بانتظار تأكيد الاستلام','warn'],confirmed:['استلمته د. هدى','good'],rejected:['لم يُستلم · عاد للعيادة','bad']};
const hoStatus=x=>x.kind==='toMain'?(x.status||'confirmed'):'confirmed';
const pendingHandovers=()=>all('cashMoves').filter(x=>x.kind==='toMain'&&hoStatus(x)==='pending').sort(byDate);
function custodyCard(cids,title){
  const rows=cids.map(id=>[get('clinics',id),drawerNow(id)]).filter(([c])=>c);
  const pend=pendingHandovers().filter(x=>cids.includes(x.clinicId));
  const recent=all('cashMoves').filter(x=>x.kind==='toMain'&&cids.includes(x.clinicId)).sort(byDate).slice(-5).reverse();
  return `<section class="card"><div class="card-h"><h3>${esc(title||'النقد بذمة العيادة')}</h3><b class="num">${fmt(sum(rows,r=>Math.max(0,r[1])))}</b></div>
  <div class="list">${rows.map(([c,v])=>`<div class="li"><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">النقد الموجود بصندوق العيادة الآن</div></div><b class="num ${v<0?'bad-t':''}">${fmt(v)}</b><button class="btn sm primary" data-act="cashMove" data-kind="toMain" data-id="${c.id}" ${can('handover')?'':'hidden'}>${ic('cash',16)} تسليم لـ د. هدى</button></div>`).join('')}
  ${recent.map(x=>{const s=HO_ST[hoStatus(x)];return `<div class="li" style="background:var(--surface-2)"><div class="grow"><div class="t">سُلّم ${fmt(x.amount)} د.ع${cids.length>1?' · '+esc(clinicName(x.clinicId)):''}</div><div class="s">${fmtDate(x.date)} · سلّمه ${who(x.createdBy)}${x.note?' · '+esc(x.note):''}</div></div>${chip(s[0],s[1])}${isAdmin()&&hoStatus(x)==='pending'?`<button class="btn sm primary" data-act="hoConfirm" data-id="${x.id}">تأكيد الاستلام</button><button class="btn sm ghost danger" data-act="hoReject" data-id="${x.id}">لم يُستلم</button>`:''}</div>`}).join('')}</div>
  ${pend.length&&!isAdmin()?`<p class="muted pad" style="margin:0;font-size:12.5px">${pend.length} تسليم بانتظار أن تؤكد د. هدى الاستلام.</p>`:''}</section>`}
function pendingCard(){const pend=pendingHandovers();if(!pend.length)return '';
  return `<section class="card" style="border-color:color-mix(in srgb,var(--warn) 45%,var(--line))"><div class="card-h"><h3>${ic('cash',18)} مبالغ مسلّمة بانتظار تأكيدك</h3><b class="num warn-t">${fmt(sum(pend,x=>x.amount))}</b></div><div class="list">${pend.map(x=>`<div class="li"><div class="grow"><div class="t">${fmt(x.amount)} د.ع من ${esc(clinicName(x.clinicId))}</div><div class="s">${fmtDate(x.date)} · سلّمه ${who(x.createdBy)}${x.note?' · '+esc(x.note):''}</div></div><button class="btn sm primary" data-act="hoConfirm" data-id="${x.id}">${ic('check',16)} استلمته</button><button class="btn sm ghost danger" data-act="hoReject" data-id="${x.id}">لم يُستلم</button></div>`).join('')}</div><p class="muted pad" style="margin:0;font-size:12.5px">المبلغ خرج من صندوق العيادة عند التسليم. عند التأكيد يدخل صندوقك، وإذا اخترت «لم يُستلم» يعود إلى ذمة العيادة.</p></section>`}
Object.assign(ACTIONS,{
  hoConfirm:d=>{const x=get('cashMoves',d.id);if(!x)return;confirmBox(`تأكيد استلام ${fmt(x.amount)} د.ع من ${clinicName(x.clinicId)}؟ سيُضاف إلى صندوق د. هدى.`,async()=>{await put('cashMoves',Object.assign(clone(x),{status:'confirmed',confirmedBy:Store.me||null,confirmedAt:new Date().toISOString()}));toast('أُضيف المبلغ إلى صندوق د. هدى')},'استلمته')},
  hoReject:d=>{const x=get('cashMoves',d.id);if(!x)return;confirmBox(`لم تستلم ${fmt(x.amount)} د.ع من ${clinicName(x.clinicId)}؟ سيعود المبلغ إلى ذمة العيادة.`,async()=>{await put('cashMoves',Object.assign(clone(x),{status:'rejected',confirmedBy:Store.me||null,confirmedAt:new Date().toISOString()}));toast('عاد المبلغ إلى ذمة العيادة','warn')},'لم يُستلم')},
});

/* ---------- Cash: clinic drawers carry a running balance; cash handed to Dr. Huda's safe leaves the drawer ---------- */
const PAID_FROM=[['drawer','صندوق العيادة'],['main','صندوق د. هدى'],['bank','تحويل / حساب مصرفي']];
const SRC_DEF={expenses:'drawer',supplierTx:'drawer',payouts:'main',labPayments:'main'};
const srcOf=(x,col)=>x.paidFrom||(col==='payouts'&&!x.kind?'main':(col==='payouts'&&x.kind!=='rent'&&(x.method||'cash')!=='cash'?'bank':SRC_DEF[col]));
const MOVE_KIND={toMain:['تسليم من عيادة','good'],mainIn:['إيداع','info'],mainOut:['سحب / صرف','bad'],toClinic:['تغذية صندوق عيادة','warn']};
const cashFlows=()=>M('cflow',()=>{const m=new Map();const add=(cid,d,v,k)=>{if(!cid||!d||!v)return;let c=m.get(cid);if(!c){c=new Map();m.set(cid,c)}let x=c.get(d);if(!x){x={in:0,out:0,toMain:0,fromMain:0};c.set(d,x)}x[k]+=v};
  for(const p of payments())if((p.method||'cash')==='cash')add(p.clinicId,p.date,num(p.amount),'in');
  for(const e of all('expenses'))if(!e.fixed&&srcOf(e,'expenses')==='drawer')add(e.clinicId,e.date,num(e.amount),'out');
  for(const x of all('supplierTx'))if(x.kind==='payment'&&srcOf(x,'supplierTx')==='drawer')add(x.clinicId,x.date,num(x.amount),'out');
  for(const x of all('payouts'))if(srcOf(x,'payouts')==='drawer')add(x.clinicId,x.date,num(x.amount),'out');
  for(const x of all('cashMoves')){if(x.kind==='toMain'&&hoStatus(x)==='rejected')continue;if(x.kind==='toMain')add(x.clinicId,x.date,num(x.amount),'toMain');else if(x.kind==='toClinic')add(x.clinicId,x.date,num(x.amount),'fromMain')}
  return m});
const dayFlow=(cid,d)=>cashFlows().get(cid)?.get(d)||{in:0,out:0,toMain:0,fromMain:0};
const netOf=f=>f.in-f.out-f.toMain+f.fromMain;
/* opening balance of a day = last confirmed count before it + every cash movement since */
function drawerOpening(cid,d){return M(`open:${cid}:${d}`,()=>{const cl=all('closings').filter(c=>c.clinicId===cid&&c.date<d).sort((a,b)=>b.date.localeCompare(a.date))[0];let base=cl?num(cl.counted):0;const from=cl?cl.date:'';const c=cashFlows().get(cid);if(c)for(const [dd,f] of c)if(dd>from&&dd<d)base+=netOf(f);return base})}
const drawerNow=cid=>drawerOpening(cid,addDays(TODAY,1));
const safeRows=()=>M('safeRows',()=>{const r=[];
  all('cashMoves').filter(x=>hoStatus(x)==='confirmed').forEach(x=>r.push({date:x.date,at:x.createdAt||'',kind:x.kind,label:MOVE_KIND[x.kind][0],tone:MOVE_KIND[x.kind][1],clinicId:x.clinicId,note:x.note,amt:(x.kind==='toMain'||x.kind==='mainIn'?1:-1)*num(x.amount),by:x.createdBy,col:'cashMoves',id:x.id}));
  all('expenses').filter(x=>srcOf(x,'expenses')==='main').forEach(x=>r.push({date:x.date,at:x.createdAt||'',label:'مصروف · '+((EXP_CATS.find(c=>c[0]===x.cat)||[,'أخرى'])[1]),tone:'bad',clinicId:x.clinicId,note:x.note,amt:-num(x.amount),by:x.createdBy}));
  all('payouts').filter(x=>srcOf(x,'payouts')==='main').forEach(x=>r.push({date:x.date,at:x.createdAt||'',label:x.kind==='rent'?'إيجار':x.kind==='staff'?'راتب '+(get('staff',x.personId)?.name||''):'مستحقات '+docName(x.personId),tone:'bad',clinicId:x.clinicId,note:x.note,amt:-num(x.amount),by:x.createdBy}));
  all('supplierTx').filter(x=>x.kind==='payment'&&srcOf(x,'supplierTx')==='main').forEach(x=>r.push({date:x.date,at:x.createdAt||'',label:'مورد · '+(get('suppliers',x.supplierId)?.name||''),tone:'bad',clinicId:x.clinicId,note:x.note,amt:-num(x.amount),by:x.createdBy}));
  all('labPayments').filter(x=>srcOf(x,'labPayments')==='main').forEach(x=>r.push({date:x.date,at:x.createdAt||'',label:'مختبر · '+(get('labs',x.labId)?.name||''),tone:'bad',clinicId:'',note:x.note,amt:-num(x.amount),by:x.createdBy}));
  r.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.at.localeCompare(b.at));let bal=0;r.forEach(x=>{bal+=x.amt;x.bal=bal});return r});
const safeBalance=()=>{const r=safeRows();return r.length?r[r.length-1].bal:0};

/* ---------- Month locks ---------- */
const lockedMonth=mk=>!!(get('months',mk)&&get('months',mk).locked);
const isLocked=d=>!!d&&lockedMonth(monthOf(d));
function lockViolation(col,body,id){
  const L=d=>isLocked(d);const old=id?S[col]&&S[col].get(id):null;
  if(['expenses','payouts','supplierTx','labPayments','cashMoves','closings'].includes(col)){if(body&&L(body.date))return body.date;if(old&&L(old.date))return old.date;return null}
  if(col==='treatments'){const key=p=>(p.id||'')+':'+p.amount+':'+p.date;const a=new Map(((old&&old.payments)||[]).filter(p=>!p.old).map(p=>[key(p),p])),b=new Map(((body&&body.payments)||[]).filter(p=>!p.old).map(p=>[key(p),p]));for(const [k,p] of a)if(!b.has(k)&&L(p.date))return p.date;for(const [k,p] of b)if(!a.has(k)&&L(p.date))return p.date;return null}
  if(col==='labOrders'){if(!body)return old&&L(old.sentDate)?old.sentDate:null;if((!old||num(old.cost)!==num(body.cost)||old.sentDate!==body.sentDate)&&(L(body.sentDate)||(old&&L(old.sentDate))))return body.sentDate;const ra=((old&&old.redos)||[]).length;const r=(body.redos||[]).slice(ra).find(x=>L(x.date));return r?r.date:null}
  return null;
}
function assertUnlocked(col,body,id){const d=lockViolation(col,body,id);if(d){const msg=`حسابات ${monthLabel(monthOf(d))} مقفلة. لا يمكن إضافة أو تعديل أو حذف حركات مالية بتاريخها إلا بعد فتح القفل من «إقفال الشهر».`;toast(msg,'bad');const e=new Error(msg);e.code='locked';throw e}}

/* ---------- Daily closing per clinic (admin + secretary) ---------- */
const ELEC=['zaincash','fib','qi','bank'];
function dayStats(cid,d){
  const pays=payments().filter(p=>p.date===d&&p.clinicId===cid);const byM={};pays.forEach(p=>{const k=p.method||'cash';byM[k]=(byM[k]||0)+num(p.amount)});
  const received=sum(pays,p=>p.amount),f=dayFlow(cid,d);
  const exps=all('expenses').filter(e=>e.date===d&&e.clinicId===cid&&!e.fixed);
  const sup=all('supplierTx').filter(x=>x.kind==='payment'&&x.date===d&&x.clinicId===cid);
  const pout=all('payouts').filter(x=>x.date===d&&x.clinicId===cid&&(x.method||'cash')==='cash');
  const moves=all('cashMoves').filter(x=>x.date===d&&x.clinicId===cid);
  const opening=drawerOpening(cid,d);
  const appts=all('appointments').filter(a=>a.date===d&&a.clinicId===cid&&a.status!=='cancelled');
  const newPts=all('patients').filter(p=>p.clinicId===cid&&!p.imported&&(p.createdAt||'').slice(0,10)===d).length;
  const newTx=all('treatments').filter(t=>t.clinicId===cid&&t.date===d&&!t.imported&&!t.legacy);
  const newDebt=Math.max(0,sum(newTx,tTotal)-sum(newTx,t=>sum((t.payments||[]).filter(p=>p.date===d),p=>p.amount)));
  return {pays,byM,received,cashIn:f.in,elec:received-f.in,exps,sup,pout,moves,cashOut:f.out,toMain:f.toMain,fromMain:f.fromMain,opening,expected:opening+netOf(f),appts,done:appts.filter(a=>a.status==='done').length,nos:appts.filter(a=>a.status==='noshow').length,newPts,newTx,newDebt,closing:get('closings',cid+'_'+d)};
}
const closingClinics=()=>{const r=role();let cs=all('clinics').filter(c=>c.active!==false);if(r.kind==='staff'){const st=myStaff()||{};cs=cs.filter(c=>staffClinicIds(st).includes(c.id))}else cs=cs.filter(c=>state.clinic==='all'||c.id===state.clinic);return cs.sort(byName)};
const dayNav=label=>{const d=state.cdate||TODAY;return `<div class="toolbar"><button class="icon-btn" data-act="cday" data-d="-1" aria-label="اليوم السابق">${ic('prev')}</button><div><h3>${label} · ${dayLabel(d)} ${isLocked(d)?chip('الشهر مقفل','accent'):''}</h3></div><button class="icon-btn" data-act="cday" data-d="1" aria-label="اليوم التالي">${ic('next')}</button></div><div class="toolbar">${d!==TODAY?'<button class="btn sm" data-act="cday" data-d="0">اليوم</button>':''}<input type="date" id="c-date" class="inline-sel" style="height:40px" value="${d}" data-chg="cdate" aria-label="اختيار التاريخ"></div>`};
function closingSummary(c,d,x){return `جرد ${c.name} · ${dayLabel(d)}\nرصيد أول اليوم: ${fmt(x.opening)}\nالمستلم الكلي: ${fmt(x.received)} (نقداً ${fmt(x.cashIn)} · إلكتروني ${fmt(x.elec)})\nمصروفات نقدية: ${fmt(x.cashOut)}\nسُلّم لصندوق د. هدى: ${fmt(x.toMain)}${x.fromMain?`\nتغذية من الصندوق الرئيسي: ${fmt(x.fromMain)}`:''}\nالنقد المتوقع بالصندوق: ${fmt(x.expected)}${x.closing?`\nالمعدود فعلياً: ${fmt(x.closing.counted)} · الفرق: ${fmt(x.closing.diff)}`:''}\nالمواعيد: ${x.appts.length} (منتهي ${x.done}، لم يحضر ${x.nos}) · مرضى جدد: ${x.newPts}\nديون جديدة: ${fmt(x.newDebt)} دينار`}

     <div class="stat-line"><span><b>النقد المتوقع بالصندوق</b></span><b>${fmt(x.expected)}</b></div>
     ${cl?`<div class="stat-line"><span>المعدود فعلياً</span><b>${fmt(cl.counted)}</b></div><div class="stat-line"><span>الفرق</span>${Math.abs(diff)<1?chip('مطابق','good'):chip((diff<0?'نقص ':'زيادة ')+fmt(Math.abs(diff)),'bad')}</div>`:''}
    </div>

/* ---------- Duplicate patients: same phone, same (normalised) name, or a very close spelling ---------- */
const normAr=s=>normDigits(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^؀-ۿa-zA-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const n=b.length;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function findDupes(name,phone,exceptId){
  const nn=normAr(name),pk=phoneKey(phone);const out=[];if(!nn&&!pk)return out;
  for(const p of all('patients')){if(p.id===exceptId)continue;const pn=normAr(p.name);let reason='';
    if(pk&&phoneKey(p.phone)===pk)reason='نفس رقم الهاتف';
    else if(nn&&pn===nn)reason='نفس الاسم';
    else if(nn&&pn&&nn.length>=5){const a=nn.split(' '),b=pn.split(' ');
      if(a.length>=2&&b.length>=2&&a[0]===b[0]&&a[1]===b[1])reason='نفس الاسم واسم الأب';
      else if(lev(nn,pn)<=(nn.length>12?2:1))reason='اسم مشابه جداً'}
    if(reason)out.push({p,reason,strong:reason==='نفس رقم الهاتف'||reason==='نفس الاسم'})}
  return out.sort((a,b)=>b.strong-a.strong).slice(0,6);
}

function dupGroups(){const ps=all('patients');const parent=new Map(ps.map(p=>[p.id,p.id]));const find=x=>{while(parent.get(x)!==x)x=parent.get(x);return x};const join=(a,b)=>parent.set(find(a),find(b));
  const byPhone=new Map(),byName=new Map();for(const p of ps){const k=phoneKey(p.phone);if(k){if(byPhone.has(k))join(p.id,byPhone.get(k));else byPhone.set(k,p.id)}const n=normAr(p.name);if(n){if(byName.has(n))join(p.id,byName.get(n));else byName.set(n,p.id)}}

    {k:'prev',type:'html',html:'<div class="plan-preview" id="sess-prev"></div>',show:v=>money_&&num(v.amount)>0}].concat(nextFields(nxCtx,nxDef,t.patientId)),

    onSubmit:async v=>{const a=money_?num(v.amount):0;if(a>bal+1)fail(`المبلغ أكبر من المتبقي (${fmt(bal)} د.ع)`);nextCheck(v,nxCtx);

      if(pay)setTimeout(()=>receiptModal(t.id,pay.id),60);else if(nid)setTimeout(()=>bookedModal(nid),60)}});

/* ---------- Chairs: each clinic has numbered chairs; sessions, appointments and payments carry the chair ---------- */
const chairCount=cid=>Math.max(1,Math.round(num(get('clinics',cid)?.chairs)||1));
const maxChairs=()=>Math.max(1,...optClinics().map(([id])=>chairCount(id)));
const chairOpts=n=>Array.from({length:n||maxChairs()},(_,i)=>[String(i+1),'كرسي '+(i+1)]);
const chairLbl=c=>c?'كرسي '+c:'';
/* every treatment counts as visits: its recorded sessions, or one visit on its start date when none were recorded */
const visitsOf=t=>{const ss=(t.sessions||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));return ss.length?ss.map((s,i)=>({date:s.date,doctorId:s.doctorId||t.doctorId,chair:String(s.chair||t.chair||''),note:s.note||'',n:i+1,t,paid:num(s.paid)})):[{date:t.date,doctorId:t.doctorId,chair:String(t.chair||''),note:'',n:1,t,implicit:true,paid:0}]};
const payChair=(p,t)=>String(p.chair||((t.sessions||[]).find(s=>s.date===p.date&&s.chair)||{}).chair||t.chair||'');
PAGES.chairs=()=>{
  const m=state.month;const cids=(state.clinic!=='all'?[state.clinic]:optClinics().map(c=>c[0]));
  const ts=all('treatments').filter(cf);
  const secs=cids.map(cid=>{
    const tc=ts.filter(t=>t.clinicId===cid);const n=chairCount(cid);
    const rows=new Map();const row=k=>{if(!rows.has(k))rows.set(k,{k,visits:[],pts:new Set(),docs:new Map(),value:0,coll:0});return rows.get(k)};
    for(let i=1;i<=n;i++)row(String(i));

    return `<section class="card"><div class="card-h"><h3>${esc(clinicName(cid))}</h3><span class="chip">${n} ${n===1?'كرسي':'كراسي'}</span></div>

/* ---------- Patient account: one chronological statement for all treatments ---------- */
function ledgerRows(ts){
  const ev=[];
  for(const t of ts){const tag=t.procedure+((t.teeth||[]).length?' ('+t.teeth.join('، ')+')':'');
    ev.push({date:t.date,o:0,kind:'start',t,label:(t.legacy?'رصيد سابق: ':'بدء علاج: ')+tag,doctorId:t.doctorId,chair:String(t.chair||''),debit:tTotal(t),credit:0});
    (t.sessions||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach((s,i)=>ev.push({date:s.date,o:1,kind:'session',t,label:`جلسة ${i+1}${num(t.plannedSessions)?' من '+num(t.plannedSessions):''} · ${s.note||t.procedure}`,doctorId:s.doctorId||t.doctorId,chair:String(s.chair||t.chair||''),debit:0,credit:0}));
    (t.payments||[]).forEach(p=>ev.push({date:p.date,o:2,kind:'pay',t,p,label:p.old?`مدفوع قبل النظام · ${t.procedure}`:`دفعة ${(PAY_METHODS.find(x=>x[0]===p.method)||[,'نقد'])[1]} · ${t.procedure}`,doctorId:'',chair:payChair(p,t),debit:0,credit:num(p.amount)}))}
  ev.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.o-b.o);let run=0;ev.forEach(e=>{run+=e.debit-e.credit;e.bal=run});return ev;
}
function patientLedger(p,ts){
  if(!ts.length)return '';const money_=seeMoney();

const FU_TPL_DEF={

const FU_KIND={surgery:['بعد قلع / جراحة','warn'],after:['بعد العلاج','info'],recall:['فحص دوري','accent'],manual:['متابعة مجدولة','']};
const FU_OUT=[['good','بخير ومرتاح','good'],['pain','يشكو من ألم أو انزعاج','warn'],['visit','يحتاج مراجعة','bad'],['noanswer','لم يرد','muted'],['other','أخرى','']];
const FU_SKIP_RE=/فحص|استشار|أشعة|اشعة/;const FU_SURG_RE=/قلع|جراح|زرع|زراعة|عصب|جذور|لثة/;
const fuCfg=()=>Object.assign({on:true,surgDays:1,afterDays:2,recallMonths:6,tpl:{}},(get('settings','app')||{}).fu||{});
const fuTpl=k=>(fuCfg().tpl||{})[k]||FU_TPL_DEF[k];
const fuDocId=key=>'fu_'+key.replace(/[^A-Za-z0-9_-]/g,'_');
function fuItems(){return M('fu',()=>{
  const cfg=fuCfg();const out=[];const docs=new Map(all('followups').map(d=>[d.id,d]));const used=new Set();
  const lim=addDays(TODAY,-14);
  if(cfg.on!==false)for(const t of all('treatments')){if(t.legacy||FU_SKIP_RE.test(t.procedure||''))continue;const p=get('patients',t.patientId);if(!p||p.noFollow)continue;
    const surg=FU_SURG_RE.test(t.procedure||'');const days=num(surg?cfg.surgDays:cfg.afterDays)||1;
    for(const v of visitsOf(t)){if(!v.date)continue;const due=addDays(v.date,days);if(due<lim||v.date>TODAY)continue;
      const key=`a_${t.id}_${v.n}`;const id=fuDocId(key);const d=docs.get(id);used.add(id);
      out.push({key,id,doc:d,kind:surg?'surgery':'after',pid:t.patientId,clinicId:t.clinicId,doctorId:v.doctorId||t.doctorId,t,v,due,reason:`${t.procedure}${v.implicit?'':' · جلسة '+v.n}`,status:d?d.status:'pending'})}}
  // periodic recall: last visit older than N months and nothing booked
  const rm=num(cfg.recallMonths)||6;const last=new Map();
  for(const t of all('treatments'))for(const v of visitsOf(t)){const cur=last.get(t.patientId);if(!cur||v.date>cur.date)last.set(t.patientId,{date:v.date,t})}
  const booked=new Set(all('appointments').filter(a=>a.date>=TODAY&&a.status!=='cancelled').map(a=>a.patientId));
  if(cfg.on!==false)for(const [pid,lv] of last){const p=get('patients',pid);if(!p||p.noFollow||booked.has(pid))continue;const due=addMonths(lv.date,rm);if(due>addDays(TODAY,7))continue;
    const key=`r_${pid}_${lv.date.slice(0,7).replace('-','')}`;const id=fuDocId(key);const d=docs.get(id);used.add(id);
    out.push({key,id,doc:d,kind:'recall',pid,clinicId:lv.t.clinicId||p.clinicId,doctorId:lv.t.doctorId,t:lv.t,due,lastDate:lv.date,reason:'آخر زيارة '+fmtDate(lv.date),status:d?d.status:'pending'})}
  for(const d of all('followups'))if(!used.has(d.id)&&d.kind==='manual'){const p=get('patients',d.patientId);if(!p)continue;out.push({key:d.id,id:d.id,doc:d,kind:'manual',pid:d.patientId,clinicId:d.clinicId||p.clinicId,doctorId:d.doctorId,due:d.due,reason:d.reason||'متابعة',status:d.status||'pending'})}
  return out.filter(x=>cf(x)||(!isAdmin()&&!x.doctorId&&clinicSel(x)&&pf(get('patients',x.pid)||{}))).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
})}

/* ---------- Doctors report over any period: the work follows the doctor across every clinic ---------- */
const DR_PRESETS=[['today','اليوم'],['week','هذا الأسبوع'],['month','هذا الشهر'],['last','الشهر الماضي'],['q','آخر 3 أشهر'],['year','هذه السنة'],['custom','فترة مخصصة']];
function drRange(){const p=state.drPreset||'month';const ms=TODAY.slice(0,7)+'-01';
  if(p==='today')return [TODAY,TODAY];
  if(p==='week'){const d=parse(TODAY);return [addDays(TODAY,-((d.getDay()+1)%7)),TODAY]}
  if(p==='month')return [ms,TODAY];
  if(p==='last'){const s=addMonths(ms,-1);return [s,addDays(ms,-1)]}
  if(p==='q')return [addMonths(ms,-2),TODAY];
  if(p==='year')return [TODAY.slice(0,4)+'-01-01',TODAY];
  const f=state.drFrom||ms,t=state.drTo||TODAY;return f<=t?[f,t]:[t,f]}
const inR=(d,[f,t])=>!!d&&d>=f&&d<=t;
const rangeLabel=([f,t])=>f===t?fmtDate(f)+' '+f.slice(0,4):`${fmtDate(f)} ${f.slice(0,4)} – ${fmtDate(t)} ${t.slice(0,4)}`;
function drData(rg){return M('dr:'+rg.join('|')+':'+state.clinic,()=>{
  const cOk=x=>state.clinic==='all'||x.clinicId===state.clinic;
  const rows=new Map();
  const row=id=>{if(!rows.has(id))rows.set(id,{id,visits:[],tx:[],pays:[],pts:new Set(),clinics:new Map(),appts:[],lab:0,redoDoc:0});return rows.get(id)};
  const cl=(r,cid)=>{if(!r.clinics.has(cid))r.clinics.set(cid,{visits:0,pts:new Set(),tx:0,value:0,collected:0});return r.clinics.get(cid)};
  for(const t of all('treatments')){if(!cOk(t))continue;
    for(const v of visitsOf(t))if(v.doctorId&&inR(v.date,rg)){const r=row(v.doctorId);r.visits.push(v);r.pts.add(t.patientId);const c=cl(r,t.clinicId);c.visits++;c.pts.add(t.patientId)}
    if(t.doctorId&&inR(t.date,rg)&&!t.legacy){const r=row(t.doctorId);r.tx.push(t);r.pts.add(t.patientId);const c=cl(r,t.clinicId);c.tx++;c.value+=tTotal(t);c.pts.add(t.patientId)}
    if(t.doctorId)for(const p of t.payments||[])if(!p.old&&inR(p.date,rg)&&!(t.legacy&&!t.legacyShare)){const r=row(t.doctorId);r.pays.push({p,t});cl(r,t.clinicId).collected+=num(p.amount)}}
  for(const a of all('appointments'))if(a.doctorId&&cOk(a)&&inR(a.date,rg))row(a.doctorId).appts.push(a);
  for(const o of all('labOrders')){if(!o.doctorId||!cOk(o))continue;const r=row(o.doctorId);if(inR(o.sentDate,rg))r.lab+=num(o.cost);for(const x of o.redos||[])if(inR(x.date,rg)){if(x.bearer==='doctor')r.redoDoc+=num(x.cost);else if(x.bearer==='clinic')r.lab+=num(x.cost)}}
  const out=[];
  for(const d of all('doctors')){const r=rows.get(d.id);if(!r&&(d.active===false||(state.clinic!=='all'&&!(d.clinicIds||[]).includes(state.clinic))))continue;const x=r||row(d.id);
    const value=sum(x.tx,tTotal),collected=sum(x.pays,y=>y.p.amount),remaining=sum(x.tx,tBal),unpriced=x.tx.filter(t=>!tTotal(t)).length;
    const hasPct=d.payType==='percent'||d.payType==='mixed';const base=Math.max(0,collected-(d.labDeduct?x.lab:0));const share=hasPct?Math.round(base*num(d.percent)/100):0;
    out.push({d,...x,value,collected,remaining,unpriced,share,base,done:x.appts.filter(a=>a.status==='done').length,noshow:x.appts.filter(a=>a.status==='noshow').length})}
  return out.sort((a,b)=>b.value-a.value||b.visits.length-a.visits.length);
})}

      ${Object.keys(procs).length?`<div class="cat-row">${Object.entries(procs).sort((a,b)=>b[1]-a[1]).map(([k,n])=>chip(`${k}: ${n}`,'accent')).join('')}</div>`:''}
      ${r.tx.length?`<div class="tbl-wrap"><table class="tbl mini"><thead><tr><th>التاريخ</th><th>المريض</th><th>العلاج</th><th>العيادة</th><th>الجلسات</th><th class="n">الكلفة</th><th class="n">المدفوع</th><th class="n">المتبقي</th></tr></thead><tbody>${r.tx.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>`<tr class="click" data-act="openPatient" data-id="${t.patientId}"><td>${fmtDate(t.date)}</td><td>${esc(patientName(t.patientId))}</td><td>${esc(t.procedure)}${(t.teeth||[]).length?`<span class="teeth-tag">${t.teeth.join('، ')}</span>`:''}</td><td>${esc(clinicName(t.clinicId))}</td><td>${esc(sessLabel(t))}</td><td class="n">${tTotal(t)?fmt(tTotal(t)):'<span class="warn-t">—</span>'}</td><td class="n">${fmt(tPaid(t))}</td><td class="n">${fmt(tBal(t))}</td></tr>`).join('')}</tbody></table></div>`:''}

  return `${secHead('تقرير الأطباء · '+esc(rangeLabel(rg)),'عمل كل طبيب في كل العيادات التي اشتغل بها خلال الفترة. اضغط على الطبيب لتفاصيل كل عيادة وكل علاج.',`<button class="btn" data-act="drExport">${ic('down',16)} تصدير Excel للكل</button>`)}

const docSeesPrice=d=>!!d&&d.showPrices!==false;
function drMine(){

  return `${secHead('تقرير عملي · '+esc(rangeLabel(rg)),'المرضى الذين استقبلتهم والحالات التي عالجتها في كل العيادات خلال الفترة.',`<button class="btn" data-act="drExportMine">${ic('down',16)} تصدير Excel</button>`)}
  ${head}

/* ---------- Old patients: add a patient with his past treatments in three simple steps, or load many from an Excel/CSV file ---------- */
/* What goes in: patient data, past treatments (cost, what he already paid, sessions done) or just a remaining balance.
   Past payments are marked old:true: they count in the patient's balance but never in revenue, cash closing or doctors' dues of today. */
const sleep2=ms=>new Promise(r=>setTimeout(r,ms));
async function bulkPar(ops,label,conc){
  let i=0,done=0;const t0=toast(label+' 0/'+ops.length,'',true);let fatal=null;
  const worker=async()=>{while(i<ops.length&&!fatal){const op_=ops[i++];
    for(let tries=0;;tries++){try{await op_();break}catch(e){if(e&&e.code==='resource_exhausted'&&tries<6){await sleep2(800*(tries+1));continue}fatal=e;return}}
    done++;if(t0)t0.textContent=label+' '+done+'/'+ops.length}};
  await Promise.all(Array.from({length:Math.max(1,Math.min(conc||1,ops.length))},worker));
  if(t0){t0.classList.add('out');setTimeout(()=>t0.remove(),400)}
  if(fatal)throw fatal;
}
const teethOf=s=>[...new Set(normDigits(String(s||'')).split(/[^\d]+/).filter(x=>/^([1-4][1-8]|[5-8][1-5])$/.test(x)))];
const isoOk=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')&&!isNaN(parse(d).getTime());
function readDate(s){s=normDigits(String(s||'')).trim();if(!s)return '';let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let d=a,mo=b;if(a<=12&&b>12){d=b;mo=a}return `${y}-${pad(mo)}-${pad(d)}`}return ''}
const cleanPhone=s=>{let d=normDigits(String(s||'')).replace(/\D/g,'');if(d.startsWith('964'))d='0'+d.slice(3);if(d.length===10&&d.startsWith('7'))d='0'+d;return d};
const txKey=t=>normAr(t.procedure||'')+'|'+(t.date||'')+'|'+Math.round(num(t.fee));
/* ---- saving (shared by the wizard and the file import) ----
   rec = {existingId,name,phone,clinicId,gender,age,alerts,notes, tx:[{procedure,teeth[],doctorId,date,fee,paid,sessions,note}], balance:{amount,date,note,doctorId}} */
async function saveRecs(recs){
  const st={patients:0,tx:0,balances:0,skipped:0,fee:0,paid:0};const ops=[];
  for(const r of recs)ops.push(async()=>{
    let pid=r.existingId;
    if(!pid){pid=await put('patients',{name:r.name.trim(),phone:cleanPhone(r.phone),noPhone:!!r.noPhone,noPhoneWhy:r.noPhoneWhy||'',clinicId:r.clinicId,gender:r.gender||'',age:r.age||'',alerts:r.alerts||[],notes:r.notes||'من السجلات القديمة',imported:true});st.patients++}
    r.pid=pid;const have=new Set(all('treatments').filter(t=>t.patientId===pid).map(txKey));
    for(const t of r.tx||[]){
      if(have.has(txKey(t))){st.skipped++;continue}
      const n=Math.min(60,Math.max(0,Math.round(num(t.sessions))));const paid=Math.min(num(t.paid),num(t.fee));
      const sessions=Array.from({length:n},()=>({id:uid(),date:t.date,doctorId:t.doctorId||'',chair:'',note:'جلسة سابقة (من السجلات)',paid:0,old:true}));
      await put('treatments',{patientId:pid,procedure:t.procedure.trim(),cat:t.cat||guessCat(t.procedure),clinicId:t.clinicId||r.clinicId,doctorId:t.doctorId||'',date:t.date,teeth:t.teeth||[],fee:num(t.fee),discount:0,plan:paid>=num(t.fee)?'cash':'partial',down:0,schedule:[],
        payments:paid>0?[{id:uid(),amount:paid,date:t.date,method:'cash',note:'مدفوع قبل استخدام النظام',old:true}]:[],sessions,plannedSessions:num(t.planned)||'',imported:true,notes:t.note||''});
      st.tx++;st.fee+=num(t.fee);st.paid+=paid;have.add(txKey(t))}
    const b=r.balance;if(b&&num(b.amount)>0){
      const d=b.date||TODAY;const dupB=all('treatments').some(t=>t.patientId===pid&&t.legacy&&Math.round(tTotal(t))===Math.round(num(b.amount)));
      if(dupB)st.skipped++;else{await put('treatments',{patientId:pid,procedure:'رصيد سابق من السجلات'+(b.note?' · '+b.note:''),clinicId:r.clinicId,doctorId:b.doctorId||'',date:d,teeth:[],fee:num(b.amount),discount:0,plan:'partial',down:0,schedule:[],payments:[],legacy:true,legacyShare:false,imported:true,notes:b.note||''});st.balances++;st.fee+=num(b.amount)}}
  });
  await bulkPar(ops,'جارِ الحفظ',Store.mode==='local'?1:4);
  return st;
}

  const open=all('treatments').filter(x=>x.patientId===t.patientId&&!x.legacy&&(num(x.plannedSessions)?sessDone(x)<num(x.plannedSessions):true)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
