  return `<div class="scope-bar" style="--ch:${clinicHue(c.id)}"><span class="scope-dot"></span><span class="grow">أنت داخل <b>${esc(c.name)}</b> · ${['monthclose','users','prefs','clinics','labs'].includes(state.page)?'هذه الصفحة عامة لكل العيادات':'هذه الصفحة تعرض بيانات هذه العيادة فقط'}</span><button class="btn sm" data-act="openClinic" data-id="${c.id}">${ic('building',14)} لوحة العيادة</button><button class="btn sm ghost" data-act="allClinics">كل العيادات</button></div>`}
ACTIONS.openClinic=d=>{state.clinic=d.id;state.cTab=state.cTab||'today';saveUi();go('clinic')};
ACTIONS.allClinics=()=>{state.clinic='all';saveUi();if(state.page==='clinic')go(isAdmin()?'clinics':homeOf());else render()};
ACTIONS.cTab=d=>{state.cTab=d.v;render();window.scrollTo({top:0})};
ACTIONS.clinicAppt=d=>{const m=ACTIONS.newAppt;if(m)m(d)};

PAGES.clinic=()=>{
  const mine=optClinics().map(x=>x[0]);let cid=state.clinic!=='all'?state.clinic:(mine.length===1?mine[0]:null);if(cid&&!mine.includes(cid))cid=null;const c=cid&&get('clinics',cid);
  if(!c){const cs=all('clinics').filter(x=>x.active!==false&&mine.includes(x.id)).sort(byName);
    return `${secHead('اختر العيادة','كل عيادة لها لوحة خاصة: مواعيدها ومرضاها وحساباتها وتقاريرها')}<div class="cl-pick">${cs.map(x=>`<button class="card cl-pick-i" style="--ch:${clinicHue(x.id)}" data-act="openClinic" data-id="${x.id}"><span class="scope-dot"></span><b>${esc(x.name)}</b><small>${esc(x.area||'')}</small></button>`).join('')}</div>`}
  const TB=clTabs();const tab=TB.some(t=>t[0]===state.cTab)?state.cTab:'today';const hue=clinicHue(c.id);
  const ds=all('doctors').filter(d=>d.active!==false&&(d.clinicIds||[]).includes(cid));
  const ss=all('staff').filter(s=>s.clinicId===cid&&s.active!==false&&!s.accountOnly);
  const nP=clinicPatientIds(cid).size;const others=all('clinics').filter(x=>x.active!==false&&x.id!==cid&&mine.includes(x.id)).sort(byName);
  const stat=(n,l,ic_)=>`<div class="cl-stat"><b>${n}</b><span>${l}</span></div>`;
  const hero=`<section class="cl-hero" style="--ch:${hue}">
    <div class="cl-hero-top"><div class="cl-badge">${ic('building',22)}</div><div class="grow" style="min-width:0"><h2>${esc(c.name)}${sampleTag(c)}</h2><p>${esc(c.area||'')||'—'}</p></div>${c.active===false?chip('مغلقة'):''}${isAdmin()?`<button class="icon-btn" data-act="editClinic" data-id="${cid}" aria-label="بيانات العيادة" title="بيانات العيادة">${ic('edit',17)}</button>`:''}</div>
    <div class="cl-stats">${stat(chairCount(cid),'كرسي')}${stat(ds.length,'طبيب')}${stat(ss.length,'موظف')}${stat(nP,'مريض')}</div>
    <div class="cl-quick"><button data-act="newAppt" class="q-main">${ic('calendar',20)}<span>موعد</span></button><button data-act="newPatient">${ic('plus',20)}<span>مريض</span></button><button data-act="quickPay">${ic('cash',20)}<span>تسديد</span></button><button data-act="newExpense">${ic('receipt',20)}<span>مصروف</span></button></div>
    ${others.length?`<div class="cl-switch"><span class="cl-sw-l">${ic('building',14)} العيادات</span><div class="cl-sw-row">${others.map(o=>`<button style="--ch:${clinicHue(o.id)}" data-act="openClinic" data-id="${o.id}"><span class="scope-dot"></span>${esc(o.name)}</button>`).join('')}<button data-act="allClinics">كل العيادات</button></div></div>`:''}
  </section>
  <nav class="cl-tabs" role="tablist" style="--n:${TB.length}">${TB.map(([k,l,i])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="cTab" data-v="${k}">${ic(i,16)}<span>${l}</span></button>`).join('')}</nav>`;
  return hero+({today:clToday,patients:clPatients,money:clMoney,report:clReport,team:clTeam}[tab])(c);
};

const dayBar=day=>`<div class="day-bar"><button class="icon-btn" data-act="clDay" data-d="-1" aria-label="اليوم السابق">${ic('prev')}</button><label class="day-cur"><b>${day===TODAY?'اليوم':dayLabel(day)}</b><small>${day===TODAY?dayLabel(day):day.slice(0,4)}</small><input type="date" value="${day}" data-chg="clDate" aria-label="اختيار التاريخ"></label><button class="icon-btn" data-act="clDay" data-d="1" aria-label="اليوم التالي">${ic('next')}</button>${day!==TODAY?`<button class="btn sm primary" data-act="clDay" data-d="0">اليوم</button>`:''}</div>`;
ACTIONS.clDay=d=>{state.cday=Number(d.d)===0?TODAY:addDays(state.cday||TODAY,Number(d.d));render()};CHANGES.clDate=v=>{if(v){state.cday=v;render()}};
function clToday(c){
  const cid=c.id;const day=state.cday||TODAY;const isT=day===TODAY;const ap=all('appointments').filter(a=>a.clinicId===cid&&a.date===day&&a.status!=='cancelled').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const done=ap.filter(a=>a.status==='done').length,nos=ap.filter(a=>a.status==='noshow').length,waiting=ap.filter(a=>a.status==='arrived').length;
  const todayPays=payments().filter(p=>p.clinicId===cid&&p.date===day);const tomorrow=all('appointments').filter(a=>a.clinicId===cid&&a.date===addDays(day,1)&&a.status!=='cancelled').length;
  const late=instItems().filter(x=>x.state==='late'&&x.t.clinicId===cid);
  const labBad=all('labOrders').filter(o=>o.clinicId===cid&&o.status!=='delivered'&&(o.status==='redo'||labLate(o)));
  const r=rentState(c);const debt=sum(all('treatments').filter(t=>t.clinicId===cid),t=>Math.max(0,tBal(t)));
  const nC=chairCount(cid);const byChair={};ap.forEach(a=>{const k=nC>1?(a.chair||'—'):'all';(byChair[k]=byChair[k]||[]).push(a)});
  const row=a=>{const p=get('patients',a.patientId)||{};return `<div class="li"><span class="time">${t12(a.time)}</span><div class="grow"><div class="t"><a href="#patient" data-act="openPatient" data-id="${p.id||''}">${esc(p.name||'—')}</a></div><div class="s">${esc(a.procedure||'')}${a.procedure?' · ':''}${esc(docName(a.doctorId))}${nC>1&&a.chair?' · كرسي '+esc(a.chair):''}</div></div>${chip(APPT_ST[a.status]?.[0]||'',APPT_ST[a.status]?.[1])}${waBtn(p.phone,'')}</div>`};
  return `${dayBar(day)}<div class="kpis">
    ${kpi(isT?'مواعيد اليوم':'المواعيد',String(ap.length),`${done} منتهي${waiting?` · ${waiting} بالانتظار`:''}${nos?` · <span class="bad-t">${nos} لم يحضر</span>`:''}`)}
    ${seeMoney()?kpi(isT?'محصّل اليوم':'المحصّل',money(sum(todayPays,p=>p.amount)),`${todayPays.length} دفعة`,'hl'):kpi(isT?'مواعيد الغد':'مواعيد اليوم التالي',String(tomorrow),'')}
    ${seeMoney()?kpi('النقد بذمة العيادة',money(drawerNow(cid)),'لم يُسلَّم بعد'):''}
    ${seeMoney()?kpi('ديون مرضى العيادة',money(debt),late.length?`<span class="bad-t">${late.length} قسط متأخر</span>`:'لا أقساط متأخرة'):''}
  </div>
  ${todayWorkCard(cid,{day})}
  <div class="two">
   <section class="card"><div class="card-h"><h3>${isT?'مواعيد اليوم':'مواعيد'} · ${dayLabel(day)}</h3><a class="btn ghost sm" href="#appointments" data-act="go" data-page="appointments">الأسبوع كاملاً</a></div>
    ${ap.length?Object.keys(byChair).sort().map(k=>`${k!=='all'?`<div class="cl-sub">${ic('chair',14)} ${k==='—'?'بدون كرسي':'الكرسي '+esc(k)} · ${byChair[k].length}</div>`:''}<div class="list">${byChair[k].map(row).join('')}</div>`).join(''):empty('لا مواعيد اليوم',tomorrow?`غداً ${tomorrow} موعد`:'',`<button class="btn sm primary" data-act="newAppt">${ic('plus',15)} موعد جديد</button>`)}
   </section>
   <section class="card"><div class="card-h"><h3>يحتاج متابعة</h3></div>
    ${(late.length||labBad.length||(r&&r[0]!=='good'))?`<div class="list">
     ${r&&r[0]!=='good'?`<div class="li">${ic('building',18)}<div class="grow"><div class="t">إيجار العيادة</div><div class="s">${fmt(c.rent)} د.ع · يستحق ${fmtDate(c.rentNext)}</div></div>${chip(r[1],r[0])}${isAdmin()?`<button class="btn sm" data-act="payRent" data-id="${cid}">دفع</button>`:''}</div>`:''}
     ${seeMoney()?late.slice(0,5).map(x=>{const p=get('patients',x.patientId)||{};return `<div class="li">${ic('wallet',18)}<div class="grow"><div class="t">${esc(p.name||'—')}</div><div class="s">قسط ${x.n} من ${x.of} · متأخر ${daysBetween(x.due,TODAY)} يوم</div></div><b class="num bad-t">${fmt(x.left)}</b>${waBtn(p.phone,remindText(p,x))}</div>`}).join(''):''}
     ${labBad.slice(0,4).map(o=>`<div class="li">${ic('tooth',18)}<div class="grow"><div class="t">${esc(o.work)} · ${esc(patientName(o.patientId))}</div><div class="s">${esc(get('labs',o.labId)?.name||'')} · التسليم ${fmtDate(o.dueDate)}</div></div>${o.status==='redo'?chip('إعادة','bad'):chip('متأخر','warn')}</div>`).join('')}
    </div>`:empty('كل شيء منتظم','لا أقساط متأخرة ولا مختبرات متأخرة')}
    ${seeMoney()&&todayPays.length?`<div class="cl-sub">${ic('cash',14)} دفعات اليوم</div><div class="list">${todayPays.slice(0,6).map(p=>`<div class="li"><div class="grow"><div class="t">${esc(patientName(p.patientId))}</div><div class="s">${esc(p.t.procedure||'')} · ${esc((PAY_METHODS.find(m=>m[0]===p.method)||['','نقد'])[1])}</div></div><b class="num good-t">${fmt(p.amount)}</b></div>`).join('')}</div>`:''}
   </section>
  </div>`}

function clPatients(c){
  return `<div class="sec-head"><div class="toolbar"><label class="search">${ic('search',16)}<input id="q-pat" data-inp="q" value="${esc(state.q)}" placeholder="بحث بالاسم أو رقم الهاتف" aria-label="بحث"></label></div><div class="toolbar"><button class="btn primary" data-act="newPatient">${ic('plus',16)} مريض جديد</button></div></div>
  <p class="muted" style="margin:-4px 0 10px;font-size:13px">مرضى ${esc(c.name)}: من سُجّل فيها أو تعالج أو حجز فيها (${clinicPatientIds(c.id).size} مريض).</p>
  <section class="card" id="pat-list">${patientTable()}</section>`}

function clMoney(c){
  if(!seeMoney())return `<section class="card">${empty('لا صلاحية','الحسابات تظهر للإدارة فقط')}</section>`;
  const cid=c.id,m=state.month;const pays=payments().filter(p=>p.clinicId===cid&&monthOf(p.date)===m);
  const byM=PAY_METHODS.map(([k,l])=>[l,sum(pays.filter(p=>(p.method||'cash')===k),p=>p.amount)]).filter(x=>x[1]>0);const tot=sum(pays,p=>p.amount);
  const deb=debtors().filter(s=>[...s.clinics].includes(cid)).map(s=>Object.assign({},s,{cb:sum(s.tx.filter(t=>t.clinicId===cid),t=>Math.max(0,tBal(t)))})).filter(s=>s.cb>0).sort((a,b)=>b.cb-a.cb);
  const exps=all('expenses').filter(e=>e.clinicId===cid&&monthOf(e.date)===m).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<div class="kpis">${kpi('محصّل '+monthLabel(m),money(tot),`${pays.length} دفعة`,'hl')}${kpi('ديون المرضى',money(sum(deb,s=>s.cb)),`${deb.length} مريض`)}${kpi('مصاريف الشهر',money(sum(exps,e=>e.amount)),`${exps.length} مصروف`)}${kpi('النقد بذمة العيادة',money(drawerNow(cid)),'')}</div>
  <div class="two even">
   <section class="card"><div class="card-h"><h3>طرق الدفع · ${monthLabel(m)}</h3><a class="btn ghost sm" href="#closing" data-act="go" data-page="closing">الجرد اليومي</a></div><div class="pad">${byM.length?byM.map(([l,v])=>`<div class="cl-bar"><span>${esc(l)}</span><div class="bar"><i style="width:${pctOf(v,tot)}%"></i></div><b class="num">${fmt(v)}</b></div>`).join(''):'<p class="muted" style="margin:0">لا دفعات هذا الشهر</p>'}</div>
    ${pays.length?`<div class="cl-sub">${ic('cash',14)} آخر الدفعات</div><div class="list">${pays.slice(0,8).map(p=>`<div class="li"><div class="grow"><div class="t">${esc(patientName(p.patientId))}</div><div class="s">${fmtDate(p.date)} · ${esc(p.t.procedure||'')} · ${esc(docName(p.doctorId))}</div></div><b class="num good-t">${fmt(p.amount)}</b></div>`).join('')}</div>`:''}</section>
   <section class="card"><div class="card-h"><h3>أكبر الذمم في العيادة</h3><a class="btn ghost sm" href="#debts" data-act="go" data-page="debts">كل الذمم</a></div>
    ${deb.length?`<div class="list">${deb.slice(0,8).map(s=>{const p=get('patients',s.pid)||{};return `<div class="li click" data-act="openPatient" data-id="${s.pid}"><div class="grow"><div class="t">${esc(p.name||'—')}</div><div class="s">${s.tx.filter(t=>t.clinicId===cid).map(t=>esc(t.procedure)).join('، ')}${s.lastPay?' · آخر دفعة '+fmtDate(s.lastPay):''}</div></div><b class="num bad-t">${fmt(s.cb)}</b>${waBtn(p.phone,'')}</div>`}).join('')}</div>`:empty('لا ذمم','كل مرضى العيادة مسددون')}</section>
  </div>
  <section class="card"><div class="card-h"><h3>مصاريف ${monthLabel(m)}</h3><button class="btn sm" data-act="newExpense">${ic('plus',15)} مصروف</button></div>${exps.length?`<div class="list">${exps.slice(0,10).map(e=>`<div class="li"><div class="grow"><div class="t">${esc((EXP_CATS.find(x=>x[0]===e.cat)||['',e.cat||'مصروف'])[1])}</div><div class="s">${fmtDate(e.date)}${e.note?' · '+esc(e.note):''}</div></div><b class="num">${fmt(e.amount)}</b></div>`).join('')}</div>`:empty('لا مصاريف مسجلة هذا الشهر','')}</section>`}

function clReport(c){
  const cid=c.id,m=state.month;
  if(!seeMoney())return `<section class="card">${empty('لا صلاحية','التقارير المالية للإدارة فقط')}</section>`;
  const P=pl(m,cid),prev=pl(shiftMonth(m,-1),cid);
  const parts=[['أجور الأطباء',P.doctors],['رواتب الموظفين',P.staff],['الإيجار',P.rent],['مصاريف تشغيل',P.opex],['المختبر',P.lab],['مواد ومشتريات',P.supplies]].filter(x=>x[1]>0);
  const ap=all('appointments').filter(a=>a.clinicId===cid&&monthOf(a.date)===m&&a.date<=TODAY&&a.status!=='cancelled');const att=ap.filter(a=>a.status==='done'||a.status==='arrived').length,nos=ap.filter(a=>a.status==='noshow').length;
  const txs=all('treatments').filter(t=>t.clinicId===cid&&monthOf(t.date)===m);
  const newP=all('patients').filter(p=>p.clinicId===cid&&monthOf((p.createdAt||'').slice(0,10))===m).length;
  const procs={};txs.forEach(t=>{const k=(t.procedure||'—').trim();procs[k]=(procs[k]||0)+1});const topP=Object.entries(procs).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const docs=all('doctors').filter(d=>(d.clinicIds||[]).includes(cid)||payments().some(p=>p.doctorId===d.id&&p.clinicId===cid&&monthOf(p.date)===m)).map(d=>[d,sum(payments().filter(p=>p.doctorId===d.id&&p.clinicId===cid&&monthOf(p.date)===m),p=>p.amount),txs.filter(t=>t.doctorId===d.id).length]).filter(x=>x[1]||x[2]).sort((a,b)=>b[1]-a[1]);
  const rank=all('clinics').filter(x=>x.active!==false).map(x=>[x,pl(m,x.id)]).sort((a,b)=>b[1].net-a[1].net);const pos=rank.findIndex(([x])=>x.id===cid)+1;const mxR=Math.max(1,...rank.map(([,p])=>p.revenue));
  return `<div class="kpis">
    ${kpi('الإيرادات',money(P.revenue),delta(P.revenue,prev.revenue))}${kpi('الكلف',money(P.cost),delta(P.cost,prev.cost,true))}
    ${kpi('صافي الربح',money(P.net),P.revenue?`الهامش ${pctOf(P.net,P.revenue)}% · ${delta(P.net,prev.net)}`:'لا إيرادات بعد','hl')}
    ${kpi('ترتيب العيادة',rank.length>1?`${pos} من ${rank.length}`:'—','حسب صافي الربح هذا الشهر')}
  </div>
  ${catReportCard(m,cid)}
  <div class="two">${trendChart(cid)}
   <section class="card"><div class="card-h"><h3>أين ذهبت الكلف؟</h3></div><div class="pad">${parts.length?parts.sort((a,b)=>b[1]-a[1]).map(([l,v])=>`<div class="cl-bar"><span>${l}</span><div class="bar warn"><i style="width:${pctOf(v,P.cost)}%"></i></div><b class="num">${fmt(v)}</b></div>`).join(''):'<p class="muted" style="margin:0">لا كلف مسجلة</p>'}</div></section>
  </div>
  <div class="two even">
   <section class="card"><div class="card-h"><h3>الأطباء في العيادة · ${monthLabel(m)}</h3><a class="btn ghost sm" href="#doctorsReport" data-act="go" data-page="doctorsReport">تقرير الأطباء</a></div>${docs.length?`<div class="list">${docs.map(([d,v,n])=>`<div class="li"><div class="avatar sm">${esc(initials(d.name))}</div><div class="grow"><div class="t">د. ${esc(d.name)}</div><div class="s">${n} علاج جديد · ${esc(payLabel(d))}</div></div><b class="num">${fmt(v)}</b></div>`).join('')}</div>`:empty('لا عمل مسجل هذا الشهر','')}</section>
   <section class="card"><div class="card-h"><h3>نشاط العيادة</h3></div><div class="pad cl-facts">
     <div><span>مرضى جدد</span><b>${newP}</b></div><div><span>علاجات جديدة</span><b>${txs.length}</b></div><div><span>نسبة الحضور</span><b>${ap.length?pctOf(att,att+nos)+'%':'—'}</b></div><div><span>لم يحضر</span><b class="${nos?'bad-t':''}">${nos}</b></div></div>
     ${topP.length?`<div class="cl-sub">${ic('tooth',14)} أكثر العلاجات</div><div class="pad" style="padding-top:4px">${topP.map(([k,n])=>`<div class="cl-bar"><span>${esc(k)}</span><div class="bar"><i style="width:${pctOf(n,topP[0][1])}%"></i></div><b class="num">${n}</b></div>`).join('')}</div>`:''}</section>
  </div>
  ${rank.length>1?`<section class="card"><div class="card-h"><h3>مقارنة مع باقي العيادات · ${monthLabel(m)}</h3></div><div class="pad">${rank.map(([x,p])=>`<div class="cl-bar ${x.id===cid?'me':''}" style="--ch:${clinicHue(x.id)}"><span>${esc(x.name)}</span><div class="bar"><i style="width:${pctOf(p.revenue,mxR)}%;background:var(--ch)"></i></div><b class="num ${p.net<0?'bad-t':''}" title="الصافي">${fmt(p.net)}</b></div>`).join('')}<p class="muted" style="margin:8px 0 0;font-size:12px">الشريط = الإيرادات، والرقم = صافي الربح.</p></div></section>`:''}`}

function clTeam(c){
  const cid=c.id,m=state.month;const ds=all('doctors').filter(d=>d.active!==false&&(d.clinicIds||[]).includes(cid)).sort(byName);
  const ss=all('staff').filter(s=>s.clinicId===cid&&s.active!==false&&!s.accountOnly).sort(byName);
  const acc=r=>r.suspended?chip('موقوف','bad'):r.userId?chip('يدخل بحسابه','good'):r.inviteCode?chip('دعوة بانتظار الربط','warn'):chip('بدون حساب');
  return `<section class="card"><div class="card-h"><h3>الأطباء · ${ds.length}</h3><button class="btn sm" data-act="newDoctor">${ic('plus',15)} طبيب</button></div>${ds.length?`<div class="list">${ds.map(d=>{const dd=doctorDue(d,m,cid);const nA=all('appointments').filter(a=>a.doctorId===d.id&&a.clinicId===cid&&a.date===TODAY&&a.status!=='cancelled').length;return `<div class="li"><div class="avatar sm">${esc(initials(d.name))}</div><div class="grow"><div class="t">د. ${esc(d.name)}</div><div class="s">${esc(d.specialty||'')}${d.specialty?' · ':''}${nA} موعد اليوم${seeMoney()?` · محصّل ${fmt(dd.collected||0)} · مستحق ${fmt(dd.due||0)}`:''}</div></div>${acc(d)}</div>`}).join('')}</div>`:empty('لا أطباء مرتبطين','عدّل الطبيب واختر هذه العيادة')}</section>

/* ---------- Patients who move between clinics: where they were seen, and a shared visit history ---------- */
const reachable=id=>(state.reached||[]).includes(id);
const reach=id=>{state.reached=[...new Set((state.reached||[]).concat([id]))]};
/* every visit of a patient in every clinic (medical facts only, no money) */
function patientTimeline(pid){return M('ptl:'+pid,()=>{
  const ev=[];const seen=new Set();const key=(d,c)=>d+'|'+c;
  for(const t of all('treatments')){if(t.patientId!==pid)continue;
    const ss=sessSorted(t);
    if(!ss.length&&t.date&&!t.legacy){ev.push({date:t.date,cid:t.clinicId,doc:t.doctorId,kind:'tx',txt:'بدء علاج: '+(t.procedure||'')});seen.add(key(t.date,t.clinicId))}
    ss.forEach(s=>{ev.push({date:s.date,cid:t.clinicId,doc:s.doctorId||t.doctorId,kind:'sess',txt:`${t.procedure||'علاج'} · جلسة ${s.n}${num(t.plannedSessions)?' من '+num(t.plannedSessions):''}${s.note?' · '+s.note:''}`});seen.add(key(s.date,t.clinicId))})}
  for(const a of all('appointments')){if(a.patientId!==pid)continue;
    if(a.status==='done'||a.status==='arrived'){if(!seen.has(key(a.date,a.clinicId))){ev.push({date:a.date,cid:a.clinicId,doc:a.doctorId,kind:'visit',txt:'زيارة'+(a.procedure?': '+a.procedure:'')});seen.add(key(a.date,a.clinicId))}}
    else if(a.status==='noshow')ev.push({date:a.date,cid:a.clinicId,doc:a.doctorId,kind:'noshow',txt:'لم يحضر للموعد'+(a.procedure?' ('+a.procedure+')':'')});
    else if(a.status!=='cancelled'&&a.date>=TODAY)ev.push({date:a.date,time:a.time,cid:a.clinicId,doc:a.doctorId,kind:'next',txt:'موعد قادم'+(a.procedure?': '+a.procedure:'')})}
  for(const o of all('labOrders'))if(o.patientId===pid&&o.sentDate)ev.push({date:o.sentDate,cid:o.clinicId,doc:o.doctorId,kind:'lab',txt:'مختبر: '+(o.work||'')});
  return ev.sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
})}
function patientClinics(pid){return M('pcl:'+pid,()=>{
  const p=get('patients',pid)||{};const m=new Map();const row=cid=>{let r=m.get(cid);if(!r){r={cid,visits:new Set(),last:'',next:'',tx:0,open:0,bal:0,docs:new Set(),home:p.clinicId===cid};m.set(cid,r)}return r};
  if(p.clinicId)row(p.clinicId);
  for(const e of patientTimeline(pid)){if(!e.cid)continue;const r=row(e.cid);if(e.doc)r.docs.add(e.doc);
    if(e.kind==='next'){if(!r.next||e.date<r.next)r.next=e.date}else if(e.kind!=='noshow'&&e.kind!=='lab'&&e.date<=TODAY){r.visits.add(e.date);if(e.date>r.last)r.last=e.date}}
  for(const t of all('treatments'))if(t.patientId===pid&&t.clinicId){const r=row(t.clinicId);r.tx++;const b=tBal(t);if(b>0){r.open++;r.bal+=b}}
  return [...m.values()].sort((a,b)=>(b.last||'').localeCompare(a.last||'')||b.home-a.home);
})}
const myClinic=cid=>isAdmin()||(roleClinicIds()||[]).includes(cid);
const TL_IC={sess:'tooth',tx:'plus',visit:'check',noshow:'x',next:'calendar',lab:'flask'};
function patientClinicsCard(p){
  const rows=patientClinics(p.id);const tl=patientTimeline(p.id);if(!rows.length&&!tl.length)return '';
  const multi=rows.length>1;const all_=state.tlAll===p.id;const shown=all_?tl:tl.slice(0,8);
  const moneyOK=cid=>seeMoney()&&myClinic(cid);
  return `<section class="card pc-card"><div class="card-h"><h3>${ic('building',17)} ${multi?`يراجع ${rows.length} عيادات`:'العيادة والمراجعات'}</h3>${multi?chip('مريض متنقّل بين العيادات','accent'):''}</div>
   <div class="pc-clinics">${rows.map(r=>`<div class="pc-cl ${myClinic(r.cid)?'':'other'}" style="--ch:${clinicHue(r.cid)}"><div class="pc-cl-h"><span class="scope-dot"></span><b>${esc(clinicName(r.cid))}</b>${r.home?chip('مسجّل بها','info'):''}${!myClinic(r.cid)?chip('عيادة أخرى'):''}</div>
     <div class="pc-cl-n"><span><b>${r.visits.size}</b> زيارة</span><span><b>${r.tx}</b> علاج</span>${r.last?`<span>آخر زيارة <b>${fmtDate(r.last)}</b></span>`:''}${r.next?`<span class="good-t">موعد قادم <b>${fmtDate(r.next)}</b></span>`:''}</div>
     ${r.docs.size?`<div class="pc-cl-d">${[...r.docs].map(d=>esc(docName(d))).join('، ')}</div>`:''}
     ${r.open?(moneyOK(r.cid)?`<div class="pc-cl-b bad-t">متبقٍ عليه هنا: <b>${fmt(r.bal)}</b> د.ع</div>`:`<div class="pc-cl-b">${chip('عليه مبلغ متبقٍ في هذه العيادة','warn')}</div>`):''}</div>`).join('')}</div>
   ${tl.length?`<div class="cl-sub">${ic('calendar',14)} سجل المراجعات في كل العيادات</div><ol class="pc-tl">${shown.map(e=>`<li class="k-${e.kind}" style="--ch:${clinicHue(e.cid)}"><span class="pc-tl-ic">${ic(TL_IC[e.kind]||'check',13)}</span><div class="grow"><div class="t">${esc(e.txt)}</div><div class="s">${fmtDate(e.date)}${e.time?' · '+t12(e.time):''} · <span class="pc-tag"><span class="scope-dot"></span>${esc(clinicName(e.cid))}</span>${e.doc?' · د. '+esc(docName(e.doc)):''}</div></div></li>`).join('')}</ol>
   ${tl.length>8?`<div class="pad" style="padding-top:4px"><button class="btn ghost sm" data-act="tlAll" data-id="${p.id}">${all_?'عرض أقل':'عرض كل السجل ('+tl.length+')'}</button></div>`:''}`:''}
  </section>`}

function otherClinicMatches(q){

  return all('patients').filter(p=>!pf(p)&&((p.name||'').includes(q)||(digits.length>=4&&(p.phone||'').replace(/\D/g,'').includes(digits)))).slice(0,6)}
function otherClinicBox(q){const ms=otherClinicMatches(q);if(!ms.length)return '';
  return `<div class="pad xc-box"><div class="xc-h">${ic('building',16)} <b>موجود في عيادات أخرى</b><small>إذا راجعكم المريض افتح ملفه بدل تسجيله من جديد، حتى يبقى سجله واحداً.</small></div>${ms.map(p=>{const rs=patientClinics(p.id);return `<div class="li"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s"><span dir="ltr">${esc(p.phone||'')}</span> · ${rs.map(r=>esc(clinicName(r.cid))).join('، ')||esc(clinicName(p.clinicId))}</div></div><button class="btn sm primary" data-act="xReceive" data-id="${p.id}">${ic('users',14)} استقبال في عيادتي</button></div>`}).join('')}</div>`}

/* ---------- Visit now: the first thing on a patient's file — continue the next session and take money in one step ---------- */
const openTx=p=>all('treatments').filter(t=>t.patientId===p.id&&(isAdmin()||cf(t))&&(tBal(t)>0||(!t.legacy&&!sessState(t).finished&&(num(t.plannedSessions)>0||daysBetween(t.date||TODAY,TODAY)<=120)))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function visitNow(p){
  const ts=openTx(p);if(!ts.length)return '';const money_=seeMoney();
  const todayAp=all('appointments').filter(a=>a.patientId===p.id&&a.date===TODAY&&!['cancelled','noshow','done'].includes(a.status)&&(isAdmin()||cf(a))).sort(byTime)[0];
  const card=t=>{const s=sessState(t);const tot=tTotal(t),pd=tPaid(t),bal=tot-pd;const pl=s.pl;const legacyOnly=t.legacy&&!s.done;
    const nextN=s.todayDone?s.next.n:s.cur.n;const finished=s.finished||(pl&&nextN>pl);
    const dots=pl&&pl<=15?`<div class="vn-dots">${Array.from({length:pl},(_,i)=>{const n=i+1;return `<i class="${n<=s.done?'on':''} ${!finished&&n===nextN?'cur':''}" title="جلسة ${n}"></i>`}).join('')}</div>`:'';
    const nxAp=txAppts(t)[0];
    const sessBox=legacyOnly?`<div class="vn-big"><span>رصيد سابق</span><b>${ic('wallet',22)}</b><small>من السجلات القديمة</small></div>`
      :finished?`<div class="vn-big done"><span>الجلسات</span><b>${ic('check',22)}</b><small>اكتملت ${s.done}${pl?' من '+pl:''}</small></div>`
      :s.todayDone?`<div class="vn-big now"><span>جلسة اليوم</span><b>${s.cur.n}</b><small>سُجّلت ✓${pl?' · من '+pl:''}</small></div>`
      :`<div class="vn-big"><span>الجلسة القادمة</span><b>${nextN}</b><small>${pl?'من '+pl:s.done?'بعد '+s.done+' '+(s.done===1?'جلسة':'جلسات'):'أول جلسة'}</small></div>`;
    const moneyBox=money_?`<div class="vn-money ${bal>0?'':'paid'}"><span>${bal>0?'المتبقي عليه':'الحساب'}</span><b>${bal>0?fmt(bal):'مسدّد'}</b><small>${bal>0?`دفع ${fmt(pd)} من ${fmt(tot)}`:fmt(tot)+' د.ع'}</small>${tot>0?`<div class="vn-pbar"><i style="width:${pctOf(pd,tot)}%"></i></div>`:''}</div>`:'';
    const acts=[];
    if(!legacyOnly&&!finished&&!s.todayDone)acts.push(`<button class="btn primary vn-go" data-act="addSession" data-tid="${t.id}">${ic('tooth',17)} تسجيل الجلسة ${nextN}${money_&&bal>0&&can('pay')?' والتسديد':''}</button>`);
    if(money_&&bal>0&&can('pay'))acts.push(`<button class="btn ${legacyOnly||finished||s.todayDone?'primary vn-go':''}" data-act="addPayment" data-tid="${t.id}">${ic('cash',16)} تسديد فقط</button>`);
    if(!legacyOnly&&!finished&&!nxAp)acts.push(`<button class="btn" data-act="bookNext" data-tid="${t.id}">${ic('calendar',16)} حجز موعد الجلسة</button>`);
    if(money_&&can('price')&&!legacyOnly)acts.push(`<button class="btn ghost" data-act="extendTx" data-tid="${t.id}">${ic('plus',15)} أسنان / عمل إضافي</button>`);
    if(s.todayDone&&!finished&&!legacyOnly)acts.push(`<button class="btn ghost" data-act="addSession" data-tid="${t.id}">${ic('plus',15)} جلسة أخرى</button>`);
    return `<article class="vn-card" style="--ch:${clinicHue(t.clinicId)}">
      <div class="vn-h"><div style="min-width:0"><h4>${catChip(txCat(t))} ${esc(t.procedure||'علاج')}${(t.teeth||[]).length?`<span class="teeth-tag">${t.teeth.join('، ')}</span>`:''}</h4><p>${esc(docName(t.doctorId))} · <span class="pc-tag"><span class="scope-dot"></span>${esc(clinicName(t.clinicId))}</span>${s.prev&&s.prev.date?` · آخر جلسة ${fmtDate(s.prev.date)}`:''}</p></div>${nxAp?`<span class="chip ${nxAp.date===TODAY?'accent':'info'}">${ic('calendar',12)} ${nxAp.date===TODAY?'اليوم '+t12(nxAp.time):dayLabel(nxAp.date)}</span>`:''}</div>
      <div class="vn-row">${sessBox}${moneyBox}</div>${dots}
      ${acts.length?`<div class="vn-acts">${acts.join('')}</div>`:''}</article>`};
  return `<section class="card vn"><div class="card-h"><h3>${ic('tooth',18)} ${todayAp?`موعده اليوم ${t12(todayAp.time)} · ابدأ من هنا`:'متابعة العلاج'}</h3>${ts.length>1?chip(ts.length+' علاجات مفتوحة','info'):''}</div><div class="vn-list">${ts.slice(0,4).map(card).join('')}</div></section>`;
}
ACTIONS.visitStart=d=>{const p=get('patients',d.pid);if(!p)return;const ts=openTx(p).filter(t=>!t.legacy||sessDone(t));
  if(!ts.length)return ACTIONS.newTreatment?ACTIONS.newTreatment({pid:p.id}):null;if(ts.length===1)return sessionForm(ts[0].id);
  openModal(`<div class="m-head"><div><h3>أي علاج؟</h3><p>${esc(p.name)} عنده أكثر من علاج مفتوح</p></div><button class="icon-btn" data-act="closeModal" aria-label="إغلاق">${ic('x')}</button></div><div class="m-body"><div class="list">${ts.map(t=>{const s=sessState(t);return `<button class="li vn-pick" data-act="vnPick" data-tid="${t.id}"><div class="grow"><div class="t">${esc(t.procedure)}</div><div class="s">${esc(docName(t.doctorId))} · ${sessLabel(t)}${seeMoney()?' · المتبقي '+fmt(tBal(t)):''}</div></div>${ic('prev',16)}</button>`}).join('')}</div></div>`)};

/* ---------- Delete a patient: refused while he still owes money ---------- */
function deletePatient(pid){
  if(!isAdmin())return noPerm();const p=get('patients',pid);if(!p)return;
  const ts=all('treatments').filter(t=>t.patientId===pid);const debt=sum(ts,t=>Math.max(0,tBal(t)));
  if(debt>0){const open=ts.filter(t=>tBal(t)>0);
    return openModal(`<div class="m-head"><div><h3>${ic('alert',18)} ما يمكن حذف ${esc(p.name)}</h3><p>عليه دين متبقٍ <b class="bad-t">${fmt(debt)}</b> د.ع</p></div><button class="icon-btn" data-act="closeModal" aria-label="إغلاق">${ic('x')}</button></div>
    <div class="m-body"><p style="margin:0 0 10px">المريض اللي عليه ديون ممنوع ينحذف حتى ما تضيع الفلوس من ذمم المرضى. أول شي سدّد الدين، أو إذا كان الدين غلط عدّل كلفة العلاج.</p><div class="list">${open.map(t=>`<div class="li"><div class="grow"><div class="t">${esc(t.procedure||'علاج')}</div><div class="s">${esc(clinicName(t.clinicId))} · ${fmtDate(t.date)}</div></div><b class="num bad-t">${fmt(tBal(t))}</b>${can('pay')?`<button class="btn sm" data-act="addPayment" data-tid="${t.id}">${ic('cash',14)} تسديد</button>`:''}<button class="btn sm ghost" data-act="editTreatment" data-id="${t.id}">${ic('edit',14)} تعديل</button></div>`).join('')}</div></div>
    <div class="m-foot"><span class="sp"></span><button class="btn" data-act="closeModal">حسناً</button></div>`)}
  const lockedT=ts.find(t=>lockViolation('treatments',null,t.id));const labs=all('labOrders').filter(o=>o.patientId===pid);const lockedL=labs.find(o=>lockViolation('labOrders',null,o.id));
  if(lockedT||lockedL){const d=lockedT?(lockedT.payments||[]).find(x=>isLocked(x.date))?.date:lockedL.sentDate;return toast(`ما يمكن حذفه: عنده دفعات بشهر مقفل (${monthLabel(monthOf(d||TODAY))}). افتح القفل من «إقفال الشهر» أولاً.`,'bad')}
  const pays=ts.flatMap(t=>(t.payments||[]).filter(x=>!x.old));const ap=all('appointments').filter(a=>a.patientId===pid);const fu=all('followups').filter(f=>f.patientId===pid);
  const parts=[ts.length?`${ts.length} علاج`:'',pays.length?`${pays.length} دفعة بمجموع ${fmt(sum(pays,x=>x.amount))} د.ع (تختفي من الإيرادات والتقارير)`:'',ap.length?`${ap.length} موعد`:'',labs.length?`${labs.length} طلب مختبر`:''].filter(Boolean);
  confirmBox(`حذف ملف ${p.name} نهائياً؟${parts.length?' سيُحذف معه: '+parts.join('، ')+'.':''} لا يمكن التراجع.`,async()=>{
    const ops=[...ts.map(t=>()=>del('treatments',t.id)),...ap.map(a=>()=>del('appointments',a.id)),...labs.map(o=>()=>del('labOrders',o.id)),...fu.map(f=>()=>del('followups',f.id)),()=>del('patients',pid)];
    await bulk(ops,'جارِ الحذف');audit('patient_delete',`${p.name} · ${p.phone||'بدون رقم'} · ${ts.length} علاج`,{patientId:'',clinicId:p.clinicId,col:'patients',id:pid});closeModal();go('patients');toast('تم حذف ملف '+p.name)},'حذف نهائي')}
ACTIONS.delPatient=d=>deletePatient(d.id);
/* ---------- Extra work on an open treatment: more teeth, more money, more sessions — without starting over ---------- */
function extendForm(tid){
  const t=get('treatments',tid);if(!t)return;if(!can('price'))return noPerm();
  const tot=tTotal(t),pd=tPaid(t),bal=tot-pd;const have=(t.teeth||[]).map(String);const inst=t.plan==='installments';
  const lastDue=((t.schedule||[]).slice(-1)[0]||{}).due;const firstDef=addMonths(lastDue&&lastDue>TODAY?lastDue:TODAY,1);

    {k:'sum',type:'html',html:txSummaryHTML(t)},
    {k:'teeth',label:'الأسنان الإضافية (اختياري)',type:'teeth',hint:have.length?'الأسنان المسجّلة سابقاً تبقى كما هي؛ اختر الجديدة فقط':''},
    {k:'what',label:'شنو العمل الإضافي',ph:'مثال: تاج إضافي على 26',list:'dl-procs'},
    {k:'extra',label:'المبلغ الإضافي',type:'money',req:true,half:true,ph:'يُضاف على الكلفة الحالية'},
    {k:'sess',label:'جلسات إضافية',type:'number',min:0,max:60,half:true,ph:'0'},
    {k:'n',label:'يُقسَّط المبلغ الإضافي على (أشهر)',type:'number',min:1,max:48,half:true,show:()=>inst},
    {k:'first',label:'أول قسط للإضافة',type:'date',half:true,show:()=>inst},
    {k:'prev',type:'html',html:'<div class="plan-preview" id="ext-prev"></div>'}],
    values:{extra:'',sess:'',n:1,first:firstDef},submit:'حفظ الإضافة',
    onChange:(v,form)=>{const el=form.querySelector('#ext-prev');if(!el)return;const x=num(v.extra);
      el.innerHTML=x>0?`الكلفة <b>${fmt(tot)}</b> + الإضافة <b>${fmt(x)}</b> = <b>${fmt(tot+x)}</b> د.ع<br>المدفوع ${fmt(pd)} · المتبقي يصير <b class="bad-t">${fmt(bal+x)}</b> د.ع${num(v.sess)>0&&num(t.plannedSessions)?` · الجلسات تصير ${num(t.plannedSessions)+num(v.sess)}`:''}`:'اكتب المبلغ الإضافي وشوف الحساب الجديد هنا'},
    onSubmit:async v=>{const x=num(v.extra);if(!(x>0))fail('اكتب المبلغ الإضافي');
      const doc=clone(t);const add=(v.teeth||[]).map(String).filter(n=>!have.includes(n));
      doc.fee=num(t.fee)+x;if(add.length)doc.teeth=have.concat(add).map(Number).sort((a,b)=>a-b);
      if(num(v.sess)>0)doc.plannedSessions=(num(t.plannedSessions)||sessDone(t))+num(v.sess);

      doc.extras=(t.extras||[]).concat([{date:TODAY,amount:x,teeth:add,what:v.what||'',sessions:num(v.sess)||0,by:Store.me||null}]);
      await put('treatments',doc);toast(`أُضيف ${fmt(x)} د.ع · المتبقي الآن ${fmt(bal+x)} د.ع`)}});

function allocate(list,amount,only){let left=amount;const out=[];for(const t of list){if(only&&t.id!==only)continue;if(left<=0)break;const a=Math.min(left,tBal(t));if(a>0){out.push([t,a]);left-=a}}return {out,left}}
function settleForm(pid){

    {k:'note',label:'ملاحظة (اختياري)'}],

    onChange:(v,form)=>{const el=form.querySelector('#settle-prev');if(!el)return;const a=num(v.amount);const only=v.to&&v.to!=='auto'?v.to:null;

    onSubmit:async v=>{const a=num(v.amount);if(!(a>0))fail('اكتب المبلغ');const only=v.to&&v.to!=='auto'?v.to:null;const maxA=only?tBal(get('treatments',only)):bal;

/* ---------- Edit the patient's amounts: treatment cost, discount, and every payment, in one place ---------- */
/* when a treatment's total changes on an installment plan, move the difference onto the unpaid installments */
function adjustSchedule(doc,delta){if(doc.plan!=='installments'||!delta)return doc;const sch=(doc.schedule||[]).map(x=>Object.assign({},x));const st=schedStatus(Object.assign({},doc,{schedule:sch}));
  if(delta>0){const last=sch.length?sch[sch.length-1]:null;if(last&&st[st.length-1].state!=='paid')last.amount=num(last.amount)+delta;else sch.push({due:addMonths(last&&last.due>TODAY?last.due:TODAY,1),amount:delta})}
  else{let left=-delta;for(let i=sch.length-1;i>=0&&left>0;i--){if(st[i].state==='paid')continue;const free=num(sch[i].amount)-st[i].paid;const cut=Math.min(free,left);sch[i].amount=num(sch[i].amount)-cut;left-=cut}for(let i=sch.length-1;i>=0;i--)if(num(sch[i].amount)<=0)sch.splice(i,1)}
  doc.schedule=sch;return doc}

const FAIL_TONE={redo:'bad',comp:'bad',complaint:'warn',refund:'warn',other:'muted',labredo:'warn',noshow:'muted',abandon:'warn'};
const ABANDON_DAYS=45;
function failData(rg){return M('fail:'+rg.join('|')+':'+state.clinic,()=>{
  const cOk=x=>state.clinic==='all'||x.clinicId===state.clinic;const out=[];
  for(const t of all('treatments')){if(!cOk(t)||t.legacy)continue;
    (t.failures||[]).forEach(f=>{if(inR(f.date,rg))out.push({kind:f.type||'other',date:f.date,pid:t.patientId,tid:t.id,did:f.doctorId||t.doctorId,cid:t.clinicId,text:t.procedure||'علاج',note:f.note||'',cost:num(f.cost),bearer:f.bearer||'clinic',manual:true,fid:f.id})});
    const vs=visitsOf(t).filter(v=>v.date);const last=vs.length?vs[vs.length-1].date:'';const pl=num(t.plannedSessions);
    if(last&&pl&&vs.length<pl&&tBal(t)+1>=0){const due=addDays(last,ABANDON_DAYS);if(due<=TODAY&&inR(due,rg)&&!(t.failures||[]).some(f=>f.type==='abandon'))out.push({kind:'abandon',date:due,pid:t.patientId,tid:t.id,did:t.doctorId,cid:t.clinicId,text:t.procedure||'علاج',note:`${vs.length} من ${pl} جلسات · آخر زيارة ${fmtDate(last)}`,cost:0,bearer:''})}}
  for(const o of all('labOrders')){if(!cOk(o)||!o.doctorId)continue;(o.redos||[]).forEach(r=>{if(inR(r.date,rg))out.push({kind:'labredo',date:r.date,pid:o.patientId,did:o.doctorId,cid:o.clinicId,text:o.work||'عمل مختبر',note:r.reason||r.note||'',cost:num(r.cost),bearer:r.bearer||''})})}
  for(const a of all('appointments')){if(!cOk(a)||!a.doctorId||a.status!=='noshow'||!inR(a.date,rg))continue;out.push({kind:'noshow',date:a.date,pid:a.patientId,did:a.doctorId,cid:a.clinicId,text:a.procedure||'موعد',note:'',cost:0,bearer:''})}
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||''))})}

  ${byDoc.length?`<section class="card"><div class="card-h"><h3>حسب الطبيب</h3><span class="muted" style="font-size:12.5px">اضغط لتصفية القائمة</span></div><div class="fl-docs">${byDoc.map(r=>`<button class="fl-doc ${did===r.d.id?'on':''}" data-act="failDoc" data-v="${r.d.id}"><div class="fl-dh"><b>د. ${esc(r.d.name)}</b><span class="chip ${r.serious?'bad':''}">${r.n}</span></div><div class="bar warn"><i style="width:${pctOf(r.n,mxn)}%"></i></div><small>${Object.entries(r.kinds).map(([k,n])=>`${FAIL_LBL[k]} ${n}`).join(' · ')}${r.cost||r.costC?` · كلفة ${fmt(r.cost+r.costC)}`:''}</small></button>`).join('')}</div></section>`:''}
  <section class="card"><div class="card-h"><h3>السجل${did!=='all'?' · د. '+esc(get('doctors',did)?.name||''):''}</h3><div class="toolbar"><div class="seg">${[['all','الكل']].concat(kinds.map(k=>[k,FAIL_LBL[k]])).map(([k,l])=>`<button class="${kind===k?'on':''}" data-act="failKind" data-v="${k}">${esc(l)}</button>`).join('')}</div>${did!=='all'?`<button class="btn sm ghost" data-act="failDoc" data-v="all">كل الأطباء</button>`:''}</div></div>

ACTIONS.failExport=async()=>{const rg=drRange();const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const L=[['الحالات الفاشلة',rangeLabel(rg)].map(q).join(','),'',['التاريخ','النوع','الطبيب','المريض','العلاج','العيادة','التفاصيل','الكلفة','يتحملها'].map(q).join(',')];

/* ---------- Doctor performance: scorecard, achievements, fillers, rating ---------- */
function perfData(rg){return M('perf:'+rg.join('|')+':'+state.clinic,()=>{
  const base=drData(rg).filter(r=>r.visits.length||r.tx.length||r.pays.length||r.appts.length);
  const rows=base.map(r=>{const d=r.d;const cats={};TX_CATS.forEach(([k])=>cats[k]={tx:0,value:0,collected:0,pts:new Set(),qty:0,procs:{}});
    r.tx.forEach(t=>{const c=cats[txCat(t)];c.tx++;c.value+=tTotal(t);c.pts.add(t.patientId);c.qty+=num(t.qty);const k=(t.procedure||'—').trim();c.procs[k]=(c.procs[k]||0)+1});
    r.pays.forEach(({p,t})=>{cats[txCat(t)].collected+=num(p.amount)});
    const f=cats.filler;
    /* returning patients: had 2+ visits in the period or visited before the period */
    const visitsBy=new Map();r.visits.forEach(v=>visitsBy.set(v.t.patientId,(visitsBy.get(v.t.patientId)||0)+1));
    const returning=[...visitsBy.values()].filter(n=>n>1).length;
    const appts=r.appts.filter(a=>a.date<=TODAY&&a.status!=='cancelled');const att=appts.filter(a=>a.status==='done'||a.status==='arrived').length,nos=appts.filter(a=>a.status==='noshow').length;
    const attRate=att+nos?att/(att+nos):null;
    const owed=sum(r.tx,t=>Math.max(0,tBal(t)));const collRate=(r.collected+owed)>0?r.collected/(r.collected+owed):null;
    const reviews=(d.reviews||[]);const stars=reviews.length?sum(reviews,x=>x.stars)/reviews.length:null;
    const days=new Set(r.visits.map(v=>v.date)).size;
    return Object.assign({},r,{cats,fillers:f,returning,att,nos,attRate,collRate,owed,reviews,stars,workDays:days,avgPerPatient:r.pts.size?r.collected/r.pts.size:0,newPts:[...r.pts].filter(pid=>{const p=get('patients',pid);return p&&inR((p.createdAt||'').slice(0,10),rg)}).length})});
  const mx=k=>Math.max(1,...rows.map(r=>typeof r[k]==='number'?r[k]:r[k].length||r[k].size||0));
  const mxColl=mx('collected'),mxPts=mx('pts'),mxVis=Math.max(1,...rows.map(r=>r.visits.length));
  rows.forEach(r=>{
    const prod=r.collected/mxColl;const reach=r.pts.size/mxPts;const act=r.visits.length/mxVis;
    const ret=r.pts.size?r.returning/r.pts.size:0;
    r.fails=failsOf(rg,r.d.id);r.failSerious=failSerious(r.fails).length;const failRate=r.failSerious/Math.max(1,r.tx.length+Math.round(r.visits.length/3));
    const parts=[['التحصيل',r.collRate==null?0.6:r.collRate,20],['الحضور',r.attRate==null?0.7:r.attRate,15],['الإنتاجية',prod,25],['النشاط',(reach+act)/2,15],['عودة المرضى',Math.min(1,ret*1.5),15],['الجودة (قلة الحالات الفاشلة)',Math.max(0,1-failRate*3),10]];
    r.parts=parts;r.score=Math.round(sum(parts,p=>p[1]*p[2]));
    if(r.stars!=null)r.final=Math.round(r.score*.8+(r.stars/5)*100*.2);else r.final=r.score});
  /* achievements */
  const top=(f,min=0)=>{const s=rows.filter(r=>f(r)>min).sort((a,b)=>f(b)-f(a))[0];return s&&s.d.id};
  const best={coll:top(r=>r.collected),pts:top(r=>r.pts.size),vis:top(r=>r.visits.length),att:top(r=>r.attRate==null?0:r.attRate+r.att/1000,0),fill:top(r=>r.fillers.tx),ortho:top(r=>r.cats.ortho.tx),crown:top(r=>r.cats.crown.tx),fillc:top(r=>r.cats.fill.tx),score:top(r=>r.final),coll_rate:top(r=>r.collRate==null?0:r.collRate+r.collected/1e12,0)};
  rows.forEach(r=>{const a=[];const is=k=>best[k]===r.d.id&&rows.length>1;
    if(is('coll'))a.push(['🏆','الأكثر تحصيلاً']);if(is('pts'))a.push(['👥','الأكثر مرضى']);if(is('vis'))a.push(['⚡','الأكثر جلسات']);
    if(is('att')&&r.nos===0&&r.att>=3)a.push(['✅','أعلى التزام بالمواعيد']);if(is('fill')&&r.fillers.tx)a.push(['💉','الأكثر فيلر']);if(is('ortho')&&r.cats.ortho.tx)a.push(['😁','الأكثر تقويم']);if(is('crown')&&r.cats.crown.tx)a.push(['👑','الأكثر تلبيسات']);
    if(is('coll_rate')&&r.collRate>=.9)a.push(['💰','أفضل نسبة تحصيل']);
    if(r.stars!=null&&r.stars>=4.5&&r.reviews.length>=2)a.push(['⭐','تقييم إدارة ممتاز']);
    if(r.visits.length>=20)a.push(['🔥','نشاط عالٍ']);if(r.nos===0&&r.att>=5)a.push(['🎯','بدون غياب مرضى']);if(r.failSerious===0&&r.tx.length>=5)a.push(['🛡️','بدون حالات فاشلة']);
    r.badges=a});
  rows.sort((a,b)=>b.final-a.final||b.collected-a.collected);rows.forEach((r,i)=>r.rank=i+1);
  return rows})}

/* ---------- Today's work: everything done today, with or without an appointment ---------- */
const localDay=iso=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return String(iso).slice(0,10);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function todayWork(cid,day){day=day||TODAY;
  const inC=x=>(!cid||x.clinicId===cid);const rows=new Map();const row=pid=>{if(!rows.has(pid))rows.set(pid,{pid,isNew:false,tx:[],sess:[],pays:[],doctors:new Set(),clinics:new Set(),by:new Set()});return rows.get(pid)};
  for(const p of all('patients')){if(localDay(p.createdAt)!==day)continue;if(!(cid?p.clinicId===cid:true))continue;if(!isAdmin()&&!pf(p))continue;const r=row(p.id);r.isNew=true;r.clinics.add(p.clinicId);if(p.createdBy)r.by.add(p.createdBy)}
  for(const t of all('treatments')){if(!inC(t)||!(isAdmin()||cf(t)))continue;
    const createdToday=localDay(t.createdAt)===day||t.date===day;
    if(createdToday&&!t.legacy){const r=row(t.patientId);r.tx.push(t);if(t.doctorId)r.doctors.add(t.doctorId);r.clinics.add(t.clinicId);if(t.createdBy)r.by.add(t.createdBy)}
    visitsOf(t).forEach(v=>{if(v.date===day&&!(createdToday&&!(t.sessions||[]).length)){const r=row(t.patientId);r.sess.push({t,v});if(v.doctorId)r.doctors.add(v.doctorId);r.clinics.add(t.clinicId)}});
    (t.payments||[]).forEach(x=>{if(x.old||x.date!==day)return;const r=row(t.patientId);r.pays.push({t,x});r.clinics.add(t.clinicId);if(x.by)r.by.add(x.by);if(t.doctorId)r.doctors.add(t.doctorId)})}
  const list=[...rows.values()].filter(r=>r.isNew||r.tx.length||r.sess.length||r.pays.length);
  list.forEach(r=>{r.paid=sum(r.pays,o=>o.x.amount)});
  list.sort((a,b)=>b.paid-a.paid||b.tx.length-a.tx.length);
  return {list,newP:list.filter(r=>r.isNew).length,tx:sum(list,r=>r.tx.length),sess:sum(list,r=>r.sess.length),paid:sum(list,r=>r.paid),pays:sum(list,r=>r.pays.length)}}

  return nav+todayWorkCard(cid,{day,page:true})+`<p class="muted" style="font-size:12.5px;margin:0">يعرض كل مريض سُجّل أو انعالج أو دفع بهذا اليوم، بموعد أو بدون موعد. العيادة المختارة من القائمة فوق تحدد العرض.</p>`};

/* ---------- Audit log: who changed what, and when (write-only in the database rules) ---------- */
const AUDIT_LBL={patient_delete:'حذف مريض',treatment_delete:'حذف علاج',session_delete:'حذف جلسة',payment_add:'تسديد',payment_edit:'تعديل تسديد',payment_delete:'حذف تسديد',amount_edit:'تعديل كلفة علاج',doctor_change:'تغيير طبيب المريض',perms_edit:'تعديل صلاحيات',staff_delete:'حذف موظف',month_lock:'قفل شهر',month_unlock:'فتح قفل شهر'};
const AUDIT_TONE={patient_delete:'bad',treatment_delete:'bad',payment_delete:'bad',session_delete:'warn',payment_edit:'warn',amount_edit:'warn',perms_edit:'warn',staff_delete:'bad',month_unlock:'warn',doctor_change:'info',payment_add:'good',month_lock:'info'};
const auditLocal=[];
function audit(action,detail,ref){try{
  const e={at:new Date().toISOString(),by:Store.me||'local',action,detail:String(detail||'').slice(0,480),role:role().kind,patientId:(ref&&ref.patientId)||'',clinicId:(ref&&ref.clinicId)||'',refCol:(ref&&ref.col)||'',refId:(ref&&ref.id)||''};
  if(Store.mode==='cloud'&&Store.db&&Store.me)Store.db.collection('auditLog').doc(uid()).set(e).catch(()=>{});else auditLocal.unshift(e);
}catch(_){}}
let auditCache=null,auditBusy=false;
async function loadAudit(force){if(auditBusy)return;if(auditCache&&!force)return;auditBusy=true;
  try{if(Store.mode==='cloud'&&Store.db){const q=await Store.db.collection('auditLog').orderBy('at','desc').limit(300).get();auditCache=q.docs.map(d=>Object.assign({id:d.id},d.data()))}else auditCache=auditLocal.slice()}

const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||'');

function supAllocBucket(sid,cid){return M(`sab:${sid}:${cid}`,()=>{
  const inv=all('supplierTx').filter(x=>x.supplierId===sid&&x.kind==='invoice'&&(x.clinicId||'')===cid).sort(byDate);
  const pays=all('supplierTx').filter(x=>x.supplierId===sid&&x.kind==='payment'&&payAcct(x)===cid).sort(byDate);
  const st=new Map(inv.map(i=>[i.id,{paid:0,last:'',pays:[]}]));const pool=[];
  for(const p of pays){const s=p.invoiceId&&st.get(p.invoiceId);if(s){s.paid+=num(p.amount);s.pays.push(p);if((p.date||'')>s.last)s.last=p.date}else pool.push(p)}
  for(const p of pool){let left=num(p.amount);for(const i of inv){if(left<=0)break;const s=st.get(i.id);const need=num(i.amount)-s.paid;if(need<=0)continue;const take=Math.min(need,left);s.paid+=take;left-=take;s.pays.push(Object.assign({},p,{amount:take,auto:true}));if((p.date||'')>s.last)s.last=p.date}}
  const total=sum(inv,i=>i.amount),paid=sum(pays,p=>p.amount);
  return {inv,st,total,paid,bal:total-paid,last:pays.length?pays[pays.length-1].date:'',pays,cid}})}

  return {inv:parts.flatMap(p=>p.inv).sort(byDate),st,total:sum(parts,p=>p.total),paid:sum(parts,p=>p.paid),bal:sum(parts,p=>p.bal),last:parts.map(p=>p.last).filter(Boolean).sort().pop()||'',pays:parts.flatMap(p=>p.pays.filter(x=>!x.auto)).sort(byDate),parts}})}

/* ---------- Actions ---------- */

  newAppt:d=>{if(!optClinics().length)return clinicForm();apptForm(null,d&&d.pid)},editAppt:d=>apptForm(get('appointments',d.id)),

  newClinic:()=>clinicForm(),editClinic:d=>clinicForm(get('clinics',d.id)),payRent:d=>isAdmin()?rentForm(d.id):toast('دفع الإيجار من صلاحية الإدارة فقط','warn'),
  newDoctor:()=>doctorForm(),editDoctor:d=>doctorForm(get('doctors',d.id)),

  payout:d=>payoutForm(d.kind,d.id),
  linkAccount:d=>linkModal(d.kind,d.id),preview:d=>{Store.preview={kind:d.kind,id:d.id};state.clinic='all';closeModal();memo={};go(d.kind==='staff'?homeOf():HOME[d.kind])},
  endPreview:()=>{const k=Store.preview&&Store.preview.kind;Store.preview=null;scheduleRender();go(k==='doctor'?'doctors':'staff')},
  openDocReport:d=>go('docreport',{docId:d.id}),quickWork,
  delDoc:d=>confirmBox('حذف هذه الحركة؟',async()=>{await del(d.col,d.id);toast('تم الحذف')}),
  recordFixed:()=>{const m=state.month;const list=pendingFixed(m);const ops=[];let tot=0;const date=m===TODAY.slice(0,7)?TODAY:m+'-01';
    list.forEach(([c,items])=>items.forEach(it=>{tot+=it.amount;ops.push(()=>put('expenses',{cat:it.cat,clinicId:c.id,amount:it.amount,date,note:it.note,fixed:true}))}));

async function saveFile(name,data,type){
  if(Store.downloads){try{await Store.downloads.save({filename:name,data});toast('تم تجهيز الملف');return}catch(e){if(e&&e.code==='declined')return}}
  openModal(`<div class="m-head"><div><h3>انسخ البيانات</h3><p>التنزيل غير متاح هنا، انسخ النص واحفظه في ملف باسم ${esc(name)}</p></div><button class="icon-btn" data-act="closeModal" aria-label="إغلاق">${ic('x')}</button></div><div class="m-body"><textarea class="textarea-out" id="copy-out" readonly>${esc(data)}</textarea></div><div class="m-foot"><span class="sp"></span><button class="btn primary" id="copy-btn">نسخ</button></div>`,true);
  $('#copy-btn').onclick=()=>{const ta=$('#copy-out');navigator.clipboard.writeText(ta.value).then(()=>toast('تم النسخ')).catch(()=>{ta.focus();ta.select()})};
}
Object.assign(CHANGES,{
  clinic:v=>{state.clinic=v;saveUi();if(state.page==='clinic'){if(v==='all')go('clinics');else{try{history.replaceState(navSnap(),'','#clinic')}catch(e){}render()}}else render()},docId:v=>{state.docId=v;render()},date:v=>{if(v){state.date=v;render()}},
  apptStatus:async(v,d)=>{const a=get('appointments',d.id);if(a)await put('appointments',Object.assign(clone(a),{status:v})).catch(()=>{})},
  labStatus:async(v,d)=>{const o=get('labOrders',d.id);if(!o)return;if(v==='redo'){render();return redoForm(d.id)}const n=Object.assign(clone(o),{status:v});if(v==='ready'&&!o.receivedDate)n.receivedDate=TODAY;if(v==='delivered')n.deliveredDate=TODAY;await put('labOrders',n).catch(()=>{})},
  importJson:async(v,d,el)=>{const f=el.files&&el.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='huda-dental')fail('هذا الملف ليس نسخة احتياطية من النظام');const ops=[];COLS.forEach(c=>(o[c]||[]).forEach(x=>{if(x&&x.id)ops.push(()=>put(c,x))}));
    confirmBox(`سيتم استرجاع ${ops.length} سجل. السجلات بنفس المعرّف ستُستبدل.`,async()=>{await bulk(ops,'جارِ الاسترجاع');toast('تم الاسترجاع')},'استرجاع')}catch(e){toast(e.message||'ملف غير صالح','bad')}el.value=''},
});
INPUTS.money=(v,d,el)=>{const cur=el.selectionStart==null?el.value.length:el.selectionStart;const before=normDigits(el.value.slice(0,cur)).replace(/[^\d]/g,'').length;
  const raw=normDigits(el.value).replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'');const f=raw?Number(raw).toLocaleString('en-US'):'';
  if(f!==el.value){el.value=f;let pos=0,seen=0;while(pos<f.length&&seen<before){if(/\d/.test(f[pos]))seen++;pos++}try{el.setSelectionRange(pos,pos)}catch(e){}}};
INPUTS.digits=(v,d,el)=>{const n=normDigits(el.value);if(n!==el.value){const a=el.selectionStart,b=el.selectionEnd;el.value=n;try{el.setSelectionRange(a,b)}catch(e){}}};

fromHash();
